<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le tracé de dominos</title>
<meta name="robots" content="noindex">
<style>
  html, body { margin: 0; height: 100%; background: #1d2033; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; width: min(100vw, calc(100vh * 9 / 16)); width: min(100vw, calc(100dvh * 9 / 16)); height: auto; aspect-ratio: 9 / 16; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
</style>

<body>
<canvas id="c" width="1080" height="1920"></canvas>
<!-- Bump v when a script changes: browsers keep the old file for ten minutes otherwise. -->
<script src="common.js?v=1"></script>
<script src="pictures.js?v=1"></script>
<script src="art.js?v=1"></script>
<script>
// The player draws lines of dominoes with a finger, from the gold domino to the pieces of a hidden picture
// scattered on the table. Then a flick: the wave runs along the lines. A piece it touches falls, shows its part
// of the picture and passes the wave on from its edges. Once every piece has fallen they slide together into
// the picture. The box holds a few dominoes: the fewer used, the more stars. No clock and no failure: the lines
// stay for another try.
// Any domino knocks every piece within REACH of it, so lines fork, cross and join just by being close.
// Ground is drawn from above, x to the right and z up the screen; a height shows as a shift up (K) and right (AX).
const canvas = document.getElementById('c');
const W = CC.W, H = CC.H, S = 96, K = 0.45, AX = 0.22;
// Ground units: a domino every STEP, the reach of a fall, wave and marble speeds, the side of a picture cell
// on the table and in the finished picture.
const STEP = 0.5, REACH = 0.85, SPEED = 8, MARBLE = 3.5, CELL = 0.3, BIG = 0.42;
const TALL = 0.9, WIDE = 0.5, THIN = 0.12, REST = 76 * Math.PI / 180, FALL = 0.24;
// Where dominoes may stand: x0, z0, x1, z1.
const BOARD = [0.3, 1.95, 10.95, 18.3];
const SAVE = 'cc-trace-v1', FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
const px = x => x * S, py = z => H - z * S;
const smooth = k => { k = Math.max(0, Math.min(1, k)); return k * k * (3 - 2 * k); };
const inBox = (x, z, b) => x >= b[0] && x <= b[2] && z >= b[1] && z <= b[3];

// split: the picture cut in columns x rows of pieces; at: the centre of each piece, row by row from the top
// left. ref: one way to reach every piece, as finger strokes; it sets the stars. budget: the box, against ref.
// marble: a red lever the wave knocks; its marble runs the rail and knocks the domino at `to`.
const LEVELS = [
  { pic: 'Soleil', split: [1, 1], at: [[5.625, 12.6]], start: [5.625, 3.4],
    ref: [[[5.625, 3.4], [5.625, 9.3]]],
    hint: 'Dessine avec le doigt un chemin de dominos, du domino doré jusqu’à l’image. Puis touche Lancer.' },
  { pic: 'Cœur', split: [2, 1], at: [[2.25, 12.6], [9.0, 12.6]], start: [5.625, 3.4],
    ref: [[[5.625, 3.4], [5.625, 6.6]], [[5.625, 6.6], [3.6, 9.4]], [[5.625, 6.6], [7.65, 9.4]]],
    hint: 'Un chemin peut se séparer en deux : commence un trait sur un domino déjà posé.' },
  { pic: 'Arbre', split: [1, 2], at: [[5.625, 15.0], [5.625, 8.6]], start: [1.3, 3.2],
    ref: [[[1.3, 3.2], [2.6, 6.9]], [[5.625, 10.4], [5.625, 13.2]]],
    hint: 'Un morceau tombé passe la vague : un trait peut partir de son bord.' },
  { pic: 'Poussin', split: [1, 1], at: [[5.625, 13.2]], start: [5.625, 2.6],
    rocks: [[5.625, 6.6, 1.5], [2.3, 7.4, 1.1], [9.0, 7.4, 1.1]],
    ref: [[[5.625, 2.6], [7.5, 4.6], [7.5, 10.0]]] },
  { pic: 'Papillon', split: [2, 2], at: [[2.25, 14.6], [9.0, 14.6], [2.25, 8.0], [9.0, 8.0]], start: [5.625, 3.0], budget: 1.2,
    ref: [[[5.625, 3.0], [3.8, 6.3]], [[4.2, 8.0], [7.1, 8.0]], [[2.25, 9.8], [2.25, 12.8]], [[9.0, 9.8], [9.0, 12.8]]],
    hint: 'Peu de dominos dans la boîte : passe par les morceaux tombés pour aller plus loin.' },
  { pic: 'Colline', split: [1, 2], at: [[4.4, 14.0], [6.8, 6.0]], start: [9.6, 2.6],
    water: [[-1, 8.6, 12.5, 9.8]], bridges: [[1.0, 8.3, 2.4, 10.1]],
    ref: [[[9.6, 2.6], [9.6, 4.2]], [[3.2, 6.0], [1.7, 8.0], [1.7, 12.2]]],
    hint: 'Pas de domino dans l’eau : passe par le pont.' },
  { pic: 'Sous-marin', split: [1, 2], at: [[6.6, 14.6], [6.6, 6.2]], start: [6.6, 2.6],
    water: [[-1, 9.0, 12.5, 10.2]],
    marble: { lever: [1.5, 6.2, Math.PI / 2], rail: [[1.5, 6.6], [1.5, 12.0]], to: [1.5, 12.4, 0] },
    ref: [[[6.6, 2.6], [6.6, 4.4]], [[2.9, 6.2], [1.9, 6.2]], [[1.9, 12.4], [3.0, 13.0]]],
    hint: 'Fais tomber le levier rouge : la bille traverse la rivière.' },
  { pic: 'Lapin', split: [2, 2], at: [[2.25, 14.6], [9.0, 14.6], [2.25, 8.0], [9.0, 8.0]], start: [0.9, 2.6],
    rocks: [[5.625, 11.3, 1.4]],
    ref: [[[0.9, 2.6], [1.6, 6.3]], [[4.2, 8.0], [7.1, 8.0]], [[9.0, 9.8], [9.0, 12.8]], [[7.0, 14.6], [4.2, 14.6]]] },
  { pic: 'Cerf-volant', split: [3, 1], at: [[1.6, 6.0], [5.0, 14.6], [9.6, 5.8]], start: [5.625, 2.4],
    rocks: [[5.625, 6.8, 1.2]], water: [[-1, 10.0, 12.5, 11.2]], bridges: [[9.2, 9.7, 10.6, 11.5]],
    ref: [[[5.625, 2.4], [3.0, 3.4]], [[5.625, 2.4], [8.2, 3.4]], [[9.9, 9.1], [9.9, 11.8], [6.6, 13.6]]] },
  { pic: 'Éléphant', split: [2, 2], at: [[2.25, 14.8], [9.0, 14.8], [2.25, 6.4], [9.0, 5.6]], start: [5.625, 2.4],
    rocks: [[5.625, 6.0, 1.1]], water: [[-1, 9.8, 12.5, 11.0]], bridges: [[9.5, 9.5, 10.9, 11.3]],
    marble: { lever: [4.6, 8.6, Math.PI / 2], rail: [[4.6, 9.0], [4.6, 12.6]], to: [4.6, 13.0, Math.PI] },
    ref: [[[5.625, 2.4], [3.6, 4.6]], [[5.625, 2.4], [7.6, 3.9]], [[4.1, 8.1], [4.5, 8.4]], [[4.6, 13.4], [4.3, 13.4]], [[4.3, 14.8], [7.0, 14.8]]] },
];

let prog = { stars: {} };
try { prog = Object.assign(prog, JSON.parse(localStorage.getItem(SAVE) || '{}')); } catch (e) { /* no storage */ }
function saveProg() { try { localStorage.setItem(SAVE, JSON.stringify(prog)); } catch (e) { /* no storage */ } }

// state: menu, edit (drawing), run (the wave), miss (pieces left standing), rise (all stands up again), won.
let state = 'menu', L = null, clock = 0, since = 0, endAt = 0, pen = null, erasing = false;
// While a finger is down the table zooms by `s` about the point (ax, ay) of the unzoomed screen, so a finger
// move draws a shorter line; near an edge of the view it scrolls that way.
const ZOOM = 1.75, EDGE = 170, TOP_BAR = 1764, SCROLL = 650;
const cam = { s: 1, ax: W / 2, ay: H / 2 };
const toScreen = (x, y) => [(x - cam.ax) * cam.s + cam.ax, (y - cam.ay) * cam.s + cam.ay];
const fromScreen = (x, y) => [(x - cam.ax) / cam.s + cam.ax, (y - cam.ay) / cam.s + cam.ay];
// The picture's drawn version comes in at REVEAL after the win, the panel at PANEL.
const REVEAL = 1.45, PANEL = 2.1;

// ---- Sound
const SCALE = [72, 74, 76, 79, 81, 84, 86, 88, 91].map(m => 440 * Math.pow(2, (m - 69) / 12));
let actx = null, lastTock = 0;
function audio() {
  if (CC.recording) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
}
function tone(freq, vol, len, type = 'sine', when = 0) {
  if (!actx || CC.recording) return;
  const t0 = actx.currentTime + when, g = actx.createGain(), o = actx.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + len);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0 + len + 0.02);
}
const mallet = (step, vol = 0.2, when = 0) => { tone(SCALE[step], vol, 0.55, 'sine', when); tone(SCALE[step] * 4, vol * 0.22, 0.1, 'sine', when); };
const tock = p => tone(1400 + 900 * p, 0.03, 0.03, 'triangle');
const bonk = () => { tone(150, 0.2, 0.25, 'square'); tone(110, 0.15, 0.3, 'square', 0.08); };

// ---- A level: the start, the pieces of the picture, the player's dominoes
function load(n) {
  const lv = LEVELS[n], pic = PICS.list.find(p => p.name === lv.pic), [sx, sy] = lv.split, cells = [], islands = [];
  for (let iy = 0; iy < sy; iy++) for (let ix = 0; ix < sx; ix++) {
    const c0 = Math.round(ix * PICS.cols / sx), c1 = Math.round((ix + 1) * PICS.cols / sx);
    const r0 = Math.round(iy * PICS.rows / sy), r1 = Math.round((iy + 1) * PICS.rows / sy);
    const [cx, cz] = lv.at[islands.length];
    const isl = { index: islands.length, cells: [], x: cx, z: cz, x0: cx - (c1 - c0) * CELL / 2, x1: cx + (c1 - c0) * CELL / 2, z0: cz - (r1 - r0) * CELL / 2, z1: cz + (r1 - r0) * CELL / 2 };
    for (let r = r0; r < r1; r++) for (let j = c0; j < c1; j++) {
      const cell = { kind: 'cell', island: isl.index, x: cx + (j - (c0 + c1) / 2 + 0.5) * CELL, z: cz + ((r0 + r1) / 2 - r - 0.5) * CELL,
        // Its place in the finished picture.
        tx: W / S / 2 + (j + 0.5 - PICS.cols / 2) * BIG, tz: 11.2 + (PICS.rows / 2 - r - 0.5) * BIG,
        rgb: CC.rgb(PICS.palette[parseInt(pic.cells[r * PICS.cols + j], 36)]) };
      cells.push(cell); isl.cells.push(cell);
    }
    islands.push(isl);
  }
  const fixed = [{ kind: 'start', x: lv.start[0], z: lv.start[1], a: Math.PI / 2, rgb: [255, 200, 40] }];
  if (lv.marble) {
    const m = lv.marble;
    fixed.push({ kind: 'lever', x: m.lever[0], z: m.lever[1], a: m.lever[2], rgb: [226, 61, 61] },
      { kind: 'fixed', x: m.to[0], z: m.to[1], a: m.to[2], rgb: [185, 138, 82] });
  }
  L = { n, lv, pic, cells, islands, fixed, doms: [], strokes: 0, budget: Infinity, blocked: 0, fullAt: -9, order: null };
  drawStrokes(lv.ref);
  L.par = L.doms.length; L.refBlocked = L.blocked;
  L.doms = []; L.strokes = 0; L.blocked = 0;
  L.budget = Math.ceil(L.par * (lv.budget || 2)); L.three = Math.ceil(L.par * 1.1); L.two = Math.ceil(L.par * 1.4);
  state = 'edit'; pen = null; erasing = false;
  standUp();
}
function standUp() {
  for (const p of pieces()) { p.at = Infinity; p.from = null; }
  clock = 0;
}
const pieces = () => [...L.fixed, ...L.doms, ...L.cells];
function hue(h) {
  const f = k => { const m = (k + h / 30) % 12; return Math.round(255 * (0.6 - 0.34 * Math.max(-1, Math.min(m - 3, 9 - m, 1)))); };
  return [f(0), f(8), f(4)];
}

// ---- Drawing dominoes with a finger
// A domino may not stand on a rock, in water off a bridge, on a piece of the picture, off the table, or on another.
function blocked(x, z) {
  const lv = L.lv;
  if (!inBox(x, z, BOARD)) return true;
  for (const [rx, rz, r] of lv.rocks || []) if (Math.hypot(x - rx, z - rz) < r + 0.2) return true;
  if ((lv.water || []).some(w => inBox(x, z, w)) && !(lv.bridges || []).some(b => inBox(x, z, b))) return true;
  for (const isl of L.islands) if (x > isl.x0 - 0.15 && x < isl.x1 + 0.15 && z > isl.z0 - 0.15 && z < isl.z1 + 0.15) return true;
  for (const p of L.fixed) if (Math.hypot(x - p.x, z - p.z) < 0.32) return true;
  for (const d of L.doms) if (Math.hypot(x - d.x, z - d.z) < 0.32) return true;
  return false;
}
// The nearest piece within `max`, the dominoes of stroke `skip` left out.
function nearest(x, z, max, skip) {
  let best = null, bd = max;
  for (const p of pieces()) {
    if (p.stroke != null && p.stroke === skip) continue;
    const d = Math.hypot(x - p.x, z - p.z);
    if (d <= bd) { best = p; bd = d; }
  }
  return best;
}
function place(x, z, a) {
  if (L.doms.length >= L.budget) {
    if (!pen.full) { pen.full = true; L.fullAt = CC.time; bonk(); }
    return false;
  }
  if (blocked(x, z)) { L.blocked++; return false; }
  const d = { kind: 'dom', x, z, a, stroke: pen.stroke, rgb: hue((L.doms.length * 9 + L.n * 47) % 360), at: Infinity, from: null, born: CC.time };
  L.doms.push(d); L.order = null;
  tock(Math.min(1, pen.count++ / 20) * 0.6);
  return true;
}
// A stroke starting on a piece goes on from it; else its first domino stands where the finger came down.
function penDown(x, z) {
  const t = nearest(x, z, 1.0, null);
  pen = { stroke: ++L.strokes, p: t ? [t.x, t.z] : [x, z], loose: !t, count: 0, full: false };
}
function penMove(x, z) {
  let d = Math.hypot(x - pen.p[0], z - pen.p[1]);
  if (pen.loose) {
    if (d < 0.25) return;
    place(pen.p[0], pen.p[1], Math.atan2(z - pen.p[1], x - pen.p[0]));
    pen.loose = false;
  }
  while (d >= STEP) {
    const ux = (x - pen.p[0]) / d, uz = (z - pen.p[1]) / d, nx = pen.p[0] + ux * STEP, nz = pen.p[1] + uz * STEP;
    place(nx, nz, Math.atan2(uz, ux));
    pen.p = [nx, nz];
    d = Math.hypot(x - nx, z - nz);
  }
}
// A stroke that ends just short of a piece reaches it.
function penUp() {
  const own = L.doms.filter(d => d.stroke === pen.stroke), last = own.at(-1);
  if (last && !nearest(last.x, last.z, REACH, pen.stroke)) {
    const t = nearest(last.x, last.z, 1.4, pen.stroke);
    pen.p = [last.x, last.z];
    for (let k = 0; t && k < 3 && Math.hypot(t.x - pen.p[0], t.z - pen.p[1]) > REACH; k++) {
      // Short of the target's own edge: a piece of the picture keeps its dominoes off its border.
      const d = Math.hypot(t.x - pen.p[0], t.z - pen.p[1]), ux = (t.x - pen.p[0]) / d, uz = (t.z - pen.p[1]) / d;
      const len = Math.max(0.33, Math.min(STEP, d - 0.35)), nx = pen.p[0] + ux * len, nz = pen.p[1] + uz * len;
      if (!place(nx, nz, Math.atan2(uz, ux))) break;
      pen.p = [nx, nz];
    }
  }
  pen = null;
}
function drawStrokes(strokes) {
  for (const s of strokes) {
    penDown(...s[0]);
    for (let k = 1; k < s.length; k++) penMove(...s[k]);
    penUp();
  }
}
function undo() {
  if (!L.doms.length) return;
  const last = Math.max(...L.doms.map(d => d.stroke));
  L.doms = L.doms.filter(d => d.stroke !== last); L.order = null;
  tock(0);
}
function eraseAt(x, z) {
  const before = L.doms.length;
  L.doms = L.doms.filter(d => Math.hypot(x - d.x, z - d.z) > 0.45);
  if (L.doms.length < before) { L.order = null; tock(0.1); }
}

// ---- The wave: each piece falls at the soonest time the wave can reach it, from the gold domino.
function flick() {
  if (state !== 'edit') return;
  const all = pieces(), grid = new Map(), key = (i, j) => i * 4096 + j;
  for (const p of all) {
    p.at = Infinity; p.from = null; p.done = false;
    const k = key(Math.floor(p.x / REACH), Math.floor(p.z / REACH));
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(p);
  }
  const lever = L.fixed.find(p => p.kind === 'lever'), to = L.fixed.find(p => p.kind === 'fixed');
  const rail = lever && L.lv.marble.rail.reduce((s, q, k, r) => k ? s + Math.hypot(q[0] - r[k - 1][0], q[1] - r[k - 1][1]) : 0, 0);
  // A small binary heap on fall times.
  const heap = [], push = p => { heap.push(p); let i = heap.length - 1; while (i) { const j = (i - 1) >> 1; if (heap[j].at <= p.at) break; heap[i] = heap[j]; i = j; } heap[i] = p; };
  const pop = () => {
    const top = heap[0], end = heap.pop();
    if (heap.length) {
      let i = 0;
      for (;;) {
        const a = 2 * i + 1, b = a + 1;
        let m = -1, low = end.at;
        if (a < heap.length && heap[a].at < low) { m = a; low = heap[a].at; }
        if (b < heap.length && heap[b].at < low) m = b;
        if (m < 0) break;
        heap[i] = heap[m]; i = m;
      }
      heap[i] = end;
    }
    return top;
  };
  const relax = (p, q, at) => { if (at < q.at) { q.at = at; q.from = p; push(q); } };
  L.fixed[0].at = 0; push(L.fixed[0]);
  while (heap.length) {
    const p = pop();
    if (p.done) continue;
    p.done = true;
    const i0 = Math.floor(p.x / REACH), j0 = Math.floor(p.z / REACH);
    for (let i = i0 - 1; i <= i0 + 1; i++) for (let j = j0 - 1; j <= j0 + 1; j++) for (const q of grid.get(key(i, j)) || []) {
      const d = Math.hypot(q.x - p.x, q.z - p.z);
      if (q !== p && d <= REACH) relax(p, q, p.at + d / SPEED);
    }
    if (p === lever) relax(p, to, p.at + rail / MARBLE);
  }
  // A domino tips away from the one that knocked it; the last of a line lies flat.
  const knocks = new Set(all.map(p => p.from));
  for (const p of all) {
    const dir = p.from ? Math.atan2(p.z - p.from.z, p.x - p.from.x) : p.a;
    p.fa = p.kind === 'cell' || p.a == null ? dir : Math.cos(p.a - dir) < 0 ? p.a + Math.PI : p.a;
    p.rest = p.kind === 'cell' || !knocks.has(p) ? Math.PI / 2 : REST;
  }
  for (const isl of L.islands) isl.at = Math.min(...isl.cells.map(c => c.at));
  L.used = L.doms.length;
  L.seq = all.filter(p => isFinite(p.at)).sort((p, q) => p.at - q.at); L.seqI = 0;
  L.marbleAt = lever && isFinite(lever.at) ? lever.at : null; L.railLen = rail;
  endAt = Math.max(...L.seq.map(p => p.at)) + 0.8;
  clock = 0; state = 'run';
  tone(900, 0.2, 0.08, 'triangle');
}
const reached = () => L.islands.filter(isl => isFinite(isl.at)).length;
const starsNow = () => L.used <= L.three ? 3 : L.used <= L.two ? 2 : 1;
function step() {
  const t = CC.time;
  stepCamera();
  if (state === 'run') {
    clock += CC.DT;
    for (; L.seqI < L.seq.length && L.seq[L.seqI].at <= clock; L.seqI++) {
      const p = L.seq[L.seqI];
      if (p.kind === 'cell') {
        if (p.at === L.islands[p.island].at) [0, 2, 4].forEach((s, k) => mallet(s + p.island % 3, 0.15, k * 0.07));
      } else if (t - lastTock > 0.04) { tock(L.seqI % 7 / 7); lastTock = t; }
    }
    if (clock >= endAt) {
      since = t;
      if (reached() === L.islands.length) {
        state = 'won'; L.chimed = false;
        prog.stars[L.n] = Math.max(prog.stars[L.n] || 0, starsNow());
        saveProg();
        [0, 2, 4, 7].forEach((s, k) => mallet(s, 0.16, 0.9 + k * 0.09));
      } else { state = 'miss'; tone(330, 0.12, 0.3); }
    }
  } else if (state === 'won' && !L.chimed && t - since > REVEAL) {
    L.chimed = true;
    [7, 8, 6, 8].forEach((s, k) => mallet(s, 0.12, k * 0.08));
  } else if (state === 'miss' && t - since > 2.2) { state = 'rise'; since = t; }
  else if (state === 'rise' && t - since > 0.5) { state = 'edit'; standUp(); }
}
function stepCamera() {
  const want = pen && (pen.moved || CC.time - pen.t0 > 0.1) ? ZOOM : 1;
  cam.s += (want - cam.s) * (1 - Math.exp(-CC.DT * 9));
  if (Math.abs(cam.s - 1) < 0.002) cam.s = 1;

canvas.addEventListener('pointercancel', () => { if (pen && !pen.erase) penUp(); pen = null; });

// ---- Test hooks
window.__level = n => { load(n); return { par: L.par, budget: L.budget, three: L.three, two: L.two }; };
window.__ref = () => { drawStrokes(L.lv.ref); return L.doms.length; };
window.__flick = flick;
window.__skip = n => { for (let k = 0; k < n; k++) { step(); CC.time += CC.DT; } return state; };
window.__shot = () => { draw(canvas.getContext('2d')); return canvas.toDataURL('image/png'); };
const until = (test, max = 3000) => { let n = 0; while (!test() && n++ < max) window.__skip(1); return +(n * CC.DT).toFixed(1); };
// Every level: nothing falls but the gold domino without lines; its ref, drawn as strokes, reaches every piece
// with no domino refused.
window.__check = () => LEVELS.map((lv, n) => {
  load(n);
  const out = { level: n + 1, pieces: L.islands.length, par: L.par, budget: L.budget, refBlocked: L.refBlocked };
  flick(); out.alone = reached(); until(() => state === 'edit');
  window.__ref(); flick();
  out.seconds = until(() => state !== 'run');
  out.state = state; out.stars = state === 'won' ? starsNow() : 0;
  return out;
});

const query = new URLSearchParams(location.search), start = +query.get('level');
if (start >= 1 && start <= LEVELS.length) load(start - 1);
CC.run({ canvas, step, draw });
</script>
