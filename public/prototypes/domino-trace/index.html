// ---- Sound
const SCALE = [72, 74, 76, 79, 81, 84, 86, 88, 91].map(m => 440 * Math.pow(2, (m - 69) / 12));
let actx = null, lastTock = 0;
function audio() {
  if (CC.recording) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
}
function tone(freq, vol, len, type = 'sine', when = 0) {
  if (!actx || CC.recording) return;
  const t0 = actx.currentTime + when, g = actx.createGain(), o = actx.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + len);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0 + len + 0.02);
}
const mallet = (step, vol = 0.2, when = 0) => { tone(SCALE[step], vol, 0.55, 'sine', when); tone(SCALE[step] * 4, vol * 0.22, 0.1, 'sine', when); };
const tock = p => tone(1400 + 900 * p, 0.03, 0.03, 'triangle');
const bonk = () => { tone(150, 0.2, 0.25, 'square'); tone(110, 0.15, 0.3, 'square', 0.08); };

// The cells' colours, from the drawn picture's first frame: each cell takes the colour most of it shows, or a
// detail of another brightness (an eye, a smile) that covers enough of it.
const mosaics = new Map();
function mosaic(name) {
  if (mosaics.has(name)) return mosaics.get(name);
  const k = 8, c = document.createElement('canvas');
  c.width = COLS * k; c.height = ROWS * k;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.scale(k, k); ART[name](g, 0);
  const d = g.getImageData(0, 0, c.width, c.height).data, out = [], lum = b => (b[1] * 0.3 + b[2] * 0.59 + b[3] * 0.11) / b[0];
  for (let r = 0; r < ROWS; r++) for (let j = 0; j < COLS; j++) {
    const bins = new Map();
    for (let v = 0; v < k; v++) for (let u = 0; u < k; u++) {
      const i = ((r * k + v) * c.width + j * k + u) * 4, key = (d[i] >> 5) << 6 | (d[i + 1] >> 5) << 3 | d[i + 2] >> 5;
      const b = bins.get(key) || [0, 0, 0, 0];
      b[0]++; b[1] += d[i]; b[2] += d[i + 1]; b[3] += d[i + 2];
      bins.set(key, b);
    }
    const sorted = [...bins.values()].sort((a, b) => b[0] - a[0]), main = sorted[0];
    const detail = sorted.find(b => b[0] >= k * k * 0.2 && Math.abs(lum(b) - lum(main)) > 90);
    const b = detail || main;
    out.push([b[1] / b[0], b[2] / b[0], b[3] / b[0]].map(Math.round));
  }
  mosaics.set(name, out);
  return out;
}

  stars3(ctx, W / 2, 1668, 34, starsNow(), 2.5);
  text(ctx, `${L.used} dominos`, W / 2, 1724, 34, 'rgba(255,255,255,0.8)', 'center', 700);
  for (const b of wonButtons()) {
    ctx.fillStyle = b.main ? '#ffd23f' : 'rgba(255,255,255,0.18)'; CC.roundRect(ctx, ...b.rect, 38); ctx.fill();
    text(ctx, b.label, b.rect[0] + b.rect[2] / 2, b.rect[1] + b.rect[3] / 2 + 2, 36, b.main ? '#3a2a00' : '#fff');
  }
  ctx.restore();
}
function wonButtons() {
  const more = L.n + 1 < LEVELS.length;
  return [{ label: 'Niveaux', rect: [80, 1770, 290, 80], act: () => { state = 'menu'; } },
    { label: 'Rejouer', rect: [395, 1770, 290, 80], act: () => { state = 'rise'; since = CC.time; } },
    ...(more ? [{ label: 'Suivant', main: true, rect: [710, 1770, 290, 80], act: () => load(L.n + 1) }] : [])];
}
// Blocks of tiles, five a row: the first levels, the challenges, the new pieces, each under its title.
const BLOCKS = [{ top: 300, from: 0 }, { title: 'Défis', top: 790, from: LEVELS.findIndex(lv => lv.hard) },
  { title: 'Nouvelles pièces', top: 1080, from: LEVELS.findIndex(lv => lv.fresh) }];
const tileRect = i => {
  const b = BLOCKS.findLast(b => i >= b.from), j = i - b.from;
  return [45 + (j % 5) * 200, b.top + Math.floor(j / 5) * 200, 190, 190];
};
function drawMenu(ctx) {
  table(ctx);
  text(ctx, 'Le tracé de dominos', W / 2, 110, 76);
  wrap(ctx, 'Dessine des chemins de dominos jusqu’aux morceaux de l’image, puis lance la vague.', W / 2, 220, 36, W - 160, 'rgba(255,255,255,0.85)');
  for (const b of BLOCKS) if (b.title) text(ctx, b.title, 60, b.top - 40, 42, '#ffd23f', 'left');
  for (let i = 0; i < LEVELS.length; i++) {
    const [x, y, w, h] = tileRect(i), st = prog.stars[i] || 0;
    ctx.fillStyle = st ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.25)'; CC.roundRect(ctx, x, y, w, h, 28); ctx.fill();
    if (st) {
      // A level done shows its picture.
      const c = 6.5, left = x + (w - COLS * c) / 2;
      ctx.save();
      CC.roundRect(ctx, left, y + 12, COLS * c, ROWS * c, 14); ctx.clip();
      ctx.translate(left, y + 12); ctx.scale(c, c);
      ART[LEVELS[i].pic](ctx, CC.time + i * 0.7);
      ctx.restore();
      ctx.fillStyle = 'rgba(20,24,44,0.75)'; CC.roundRect(ctx, x + 6, y + 6, 58, 46, 16); ctx.fill();
      text(ctx, String(i + 1), x + 35, y + 31, 30);
    } else text(ctx, String(i + 1), x + w / 2, y + 80, 72);
    stars3(ctx, x + w / 2, y + h - 26, 16, st);
  }
}

// ---- Input
const inRect = (x, y, r, pad = 0) => x >= r[0] - pad && x <= r[0] + r[2] + pad && y >= r[1] - pad && y <= r[1] + r[3] + pad;
const inCircle = (x, y, c, pad = 0) => Math.hypot(x - c[0], y - c[1]) <= c[2] + pad;
const toGround = (x, y) => [x / S, (H - y) / S];
function down(x, y) {
  audio();
  if (state === 'menu') {
    for (let i = 0; i < LEVELS.length; i++) if (inRect(x, y, tileRect(i))) { load(i); return; }
    return;
  }
  if (inRect(x, y, [24, 24, 150, 84], 16)) { state = 'menu'; pen = null; return; }
  if (state === 'won') { if (smooth((CC.time - since - PANEL) / 0.35) > 0.5) for (const b of wonButtons()) if (inRect(x, y, b.rect, 8)) { b.act(); return; } return; }
  if (state !== 'edit') return;
  if (inCircle(x, y, UNDO, 10)) { undo(); return; }
  if (inCircle(x, y, ERASE, 10)) { erasing = !erasing; tock(0.6); return; }
  if (inRect(x, y, PLAY, 10)) { flick(); return; }
  if (y > TOP_BAR) return;
  const [gx, gz] = toGround(x, y);
  if (erasing) { pen = { erase: true, fx: x, fy: y }; eraseAt(gx, gz); return; }
  const tool = toolAt(gx, gz);
  if (tool) { turnTool(tool); return; }
  penDown(gx, gz);
  Object.assign(pen, { fx: x, fy: y, onStart: L.fixed.some(s0 => s0.kind === 'start' && Math.hypot(x - px(s0.x), y - py(s0.z + 0.25)) < 80) });
}
function move(x, y) {
  if (!pen) return;
  pen.fx = x; pen.fy = y;
  const [gx, gz] = toGround(x, y);
  if (pen.erase) eraseAt(gx, gz); else penMove(gx, gz);
}
function up() {
  if (!pen) return;
  if (pen.erase) { pen = null; return; }
  // A tap on the gold domino, without drawing, flicks it.
  if (pen.onStart && !L.doms.some(d => d.stroke === pen.stroke)) { pen = null; flick(); return; }
  penUp();
}
canvas.addEventListener('pointerdown', ev => { ev.preventDefault(); try { canvas.setPointerCapture(ev.pointerId); } catch (e) { /* not a live pointer */ } down(...CC.toCanvas(canvas, ev)); });
canvas.addEventListener('pointermove', ev => { move(...CC.toCanvas(canvas, ev)); });
canvas.addEventListener('pointerup', () => up());
canvas.addEventListener('pointercancel', () => { if (pen && !pen.erase) penUp(); pen = null; });

// ---- Test hooks
window.__level = n => { load(n); return { par: L.par, budget: L.budget, three: L.three, two: L.two }; };
window.__ref = () => { setTools(true); drawStrokes(L.lv.ref); return L.doms.length; };
window.__flick = flick;
window.__skip = n => { for (let k = 0; k < n; k++) { step(); CC.time += CC.DT; } return state; };
window.__shot = () => { draw(canvas.getContext('2d')); return canvas.toDataURL('image/png'); };
const until = (test, max = 3000) => { let n = 0; while (!test() && n++ < max) window.__skip(1); return +(n * CC.DT).toFixed(1); };
// Every level: nothing falls but the gold domino without lines; its ref, drawn as strokes, reaches every piece
// with no domino refused.
window.__check = () => LEVELS.map((lv, n) => {
  load(n);
  const out = { level: n + 1, pieces: L.islands.length, par: L.par, budget: L.budget, refBlocked: L.refBlocked };
  flick(); out.alone = reached(); until(() => state === 'edit');
  window.__ref(); flick();
  out.seconds = until(() => state !== 'run');
  out.state = state; out.stars = state === 'won' ? starsNow() : 0;
  if (L.catas.length || L.turns.length) {
    // The same lines with the catapults and turntables as the level starts must not do.
    load(n); drawStrokes(lv.ref); flick(); until(() => state !== 'run');
    out.untuned = state;
  }
  return out;
});

const query = new URLSearchParams(location.search), start = +query.get('level');
if (start >= 1 && start <= LEVELS.length) load(start - 1);
CC.run({ canvas, step, draw });
</script>
