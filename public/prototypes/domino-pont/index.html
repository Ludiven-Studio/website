<!doctype html>
<html lang="fr">

<title>Le pont de dominos</title>
<meta name="robots" content="noindex">

  html, body { margin: 0; height: 100%; background: #1d2033; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; width: min(100vw, calc(100vh * 9 / 16)); width: min(100vw, calc(100dvh * 9 / 16)); height: auto; aspect-ratio: 9 / 16; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }

<body>
<canvas id="c" width="1080" height="1920"></canvas>
<!-- Bump v when a script changes: browsers keep the old file for ten minutes otherwise. -->
<script src="common.js?v=1"></script>
<script src="core.js?v=4"></script>
<script src="pictures.js?v=1"></script>
<script>
// The course is a line of standing dominoes that climbs in rows to a picture. Gaps cut it: each is a row of
// empty places between two fixed numbers. The player lays tiles of the hand in the places. A tile carries a
// piece of the line and passes the wave on when it touches its neighbours by the same number, as in the game
// of dominoes. Then a flick on the gold domino: the wave runs as far as the course holds.
// Two modes. Calm: the player flicks when ready. Live: the wave leaves by itself and the player fills the gaps
// as it comes; it slows right down before a place that does not hold yet, and runs once the way is clear.
// Live, each gap has its own tiles: the hand shows those of the first gap that does not hold yet.
// Ground is drawn from above, x to the right and z up the screen; a height shows as a shift up the screen (K)
// and a little to the right (AX), so that a standing domino shows a face.
const canvas = document.getElementById('c');
const W = CC.W, H = CC.H, S = 96, K = 0.45, AX = 0.22;
const X1 = 1.375, X2 = 9.875, PITCH = 2, Z0 = 4.6, ZTOP = 17.9, ROW = 8.5;
const TALL = 0.9, WIDE = 0.5, THIN = 0.12, PLATE = 0.08, RATE = 16, REST = 76 * Math.PI / 180, FALL = 0.24;
// Live wave: dominoes a second, how far ahead it sees trouble, its speed in slow motion, seconds before it leaves.
const LIVE = 6, NEAR = 4, SLOW = 0.8, WAIT = 3;
const OPEN_ALL = true, SAVE = 'cc-bridge-v1';
const PIP = ['#000000', '#2f7fe0', '#2aa24d', '#e23d3d', '#8b46d8', '#ee8a1c', '#12a3a3'];
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
const LIVE_HINTS = {
  0: 'La vague part toute seule. Touche le bon domino avant qu’elle arrive au trou : elle ralentit juste devant.',
  4: 'Deux dominos à la suite : ils se touchent par le même nombre.',
};
const HINTS = {
  0: 'Touche le domino qui porte les deux nombres du trou, puis touche le domino doré.',
  1: 'Chaque trou a son domino. Il en reste un en trop.',
  2: 'Deux dominos à la suite : ils se touchent par le même nombre.',
  3: 'Un domino peut aller à deux endroits. Un seul choix bouche tout.',
  6: 'Trois dominos à la suite, et deux en trop.',
};
const px = x => x * S, py = z => H - z * S;
const smooth = k => { k = Math.max(0, Math.min(1, k)); return k * k * (3 - 2 * k); };

let prog = { stars: {}, live: {}, mode: 'live' };
try { prog = Object.assign(prog, JSON.parse(localStorage.getItem(SAVE) || '{}')); } catch (e) { /* no storage */ }
function saveProg() { try { localStorage.setItem(SAVE, JSON.stringify(prog)); } catch (e) { /* no storage */ } }
const live = () => prog.mode === 'live';
const won = () => live() ? prog.live : prog.stars;
// Calm: taking a tile back or a failed flick costs. Live: only a broken wave does.
const starsNow = () => mistakes === 0 ? 3 : mistakes <= (live() ? 1 : 2) ? 2 : 1;

// state: menu, play (laying tiles), run (the wave), fail (it stopped), rise (dominoes stand up again), won.
let state = 'menu', L = null, mistakes = 0, drag = null, stop = null, since = 0, next = 0, endAt = 0;
// The wave has its own clock: `pace` is how fast it runs against real time. near: the trouble that slows it.
let clock = 0, pace = 1, startAt = 0, near = null, slowK = 0, clear = false;

// ---- Sound: mallet notes on a five-note scale, a tock for each domino
const SCALE = [72, 74, 76, 79, 81, 84, 86, 88, 91].map(m => 440 * Math.pow(2, (m - 69) / 12));
let actx = null;
function audio() {
  if (CC.recording) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
}
function tone(freq, vol, len, type = 'sine', when = 0) {
  if (!actx || CC.recording) return;
  const t0 = actx.currentTime + when, g = actx.createGain(), o = actx.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + len);

const mallet = (step, vol = 0.2, when = 0) => { tone(SCALE[step], vol, 0.55, 'sine', when); tone(SCALE[step] * 4, vol * 0.22, 0.1, 'sine', when); };
const tock = p => tone(1400 + 900 * p, 0.03, 0.03, 'triangle');
const bonk = () => { tone(150, 0.2, 0.25, 'square'); tone(110, 0.15, 0.3, 'square', 0.08); };

// ---- A level: the course, its gaps, the hand
function load(n) {
  const def = live() ? BR.makeLive(n) : BR.make(n), R = def.rows, chain = [], ribbon = [];
  const gaps = def.gaps.map((g, index) => ({ ...g, index, slots: Array(g.n).fill(-1), since: Array(g.n).fill(-9), first: [] }));
  const arc = (cx, cz, d, f0, f1, count) => {
    for (let j = 0; j <= 12; j++) { const f = f0 + (f1 - f0) * j / 12; ribbon.push([cx + d * Math.cos(f), cz + Math.sin(f)]); }
    for (let j = 0; j < count; j++) {
      const f = f0 + (f1 - f0) * (j + 0.5) / count;
      chain.push({ x: cx + d * Math.cos(f), z: cz + Math.sin(f), a: d > 0 ? f + Math.PI / 2 : Math.PI / 2 - f, y0: 0 });
    }
  };
  let dir = 1, z = Z0;
  for (let r = 0; r < R; r++) {
    z = Z0 + r * PITCH; dir = r % 2 ? -1 : 1;
    // Gaps share the room left in the row, in half units so that dominoes keep their step.
    const mine = gaps.filter(g => g.row === r), pads = Array(mine.length + 1).fill(0);
    const room = Math.round((ROW - mine.reduce((s, g) => s + 2 * g.n + 2, 0)) * 2);
    const turn = [...pads.keys()].sort((p, q) => Math.abs(p - mine.length / 2) - Math.abs(q - mine.length / 2));
    for (let k = 0; k < room; k++) pads[turn[k % turn.length]] += 0.5;
    let s = 0;
    mine.forEach((g, k) => { s += pads[k]; g.s0 = s; g.z = z; g.dir = dir; s += 2 * g.n + 2; });
    ribbon.push([dir > 0 ? X1 : X2, z], [dir > 0 ? X2 : X1, z]);
    for (let j = 0; j < ROW * 2; j++) {
      const at = 0.25 + 0.5 * j, it = { x: dir > 0 ? X1 + at : X2 - at, z, a: dir > 0 ? 0 : Math.PI, y0: 0 };
      for (const g of mine) {
        const u = at - g.s0;
        if (u < 0 || u > 2 * g.n + 2) continue;
        it.y0 = PLATE;
        if (u > 2 * g.n + 1) { if (u < 2 * g.n + 1.5) it.joint = [g.index, g.n]; }
        else if (u > 1) {
          const i = Math.floor((u - 1) / 2);
          it.slot = [g.index, i];
          if (u - 1 - 2 * i < 0.5) { it.joint = [g.index, i]; g.first[i] = chain.length; }
        }

  }

  // falls toward the player as the wave passes over it.

  const zf = zs + PICS.rows * c + 0.7, xe = dir > 0 ? X2 : X1, climb = Math.max(1, Math.round((zf - z - 2) / 0.5));
  arc(xe, z + 1, dir, -Math.PI / 2, 0, 3);

  arc(xe, zf - 1, dir, 0, Math.PI / 2, 3);
  ribbon.push([xe, zf], [dir > 0 ? X1 : X2, zf]);
  const feed = chain.length;
  for (let j = 0; j < ROW * 2; j++) chain.push({ x: xe - dir * (0.25 + 0.5 * j), z: zf, a: dir > 0 ? Math.PI : 0, y0: 0 });
  chain.forEach((it, i) => { it.i = i; it.rgb = hue((i * 3.4 + n * 47) % 360); it.rest = REST; it.at = null; });
  chain[0].rgb = [255, 200, 40];
  const cells = [];
  for (let r = 0; r < PICS.rows; r++) for (let j = 0; j < PICS.cols; j++) {
    cells.push({ j, r, x: W / S / 2 + (j + 0.5 - PICS.cols / 2) * c, z: zs + (PICS.rows - r) * c - 0.04, rgb: CC.rgb(PICS.palette[parseInt(pic.cells[r * PICS.cols + j], 36)]), at: null });
  }
  // Rows from the south, so that a fallen domino covers the one it fell on.
  cells.sort((p, q) => p.z - q.z);

  const hand = [], owner = [];
  if (live()) for (const g of gaps) { g.k0 = hand.length; for (const tile of g.tiles) { hand.push(tile); owner.push(g.index); } }
  else for (const tile of def.hand) { hand.push(tile); owner.push(-1); }
  const home = hand.map((tile, k) => {
    const at = live() ? k - gaps[owner[k]].k0 : k, count = live() ? gaps[owner[k]].tiles.length : hand.length;
    const lines = Math.ceil(count / 5), line = Math.floor(at / 5), inLine = Math.min(5, count - line * 5);
    return [W / 2 + (at % 5 - (inLine - 1) / 2) * 206, lines === 1 ? 1766 : 1704 + line * 116];
  });

  for (let k = 0, at = 3; k < 32; k++) { at = Math.max(0, Math.min(8, at + Math.floor(rand() * 5) - 2)); tune.push(at); }

    order: chain.map(it => it.i).sort((p, q) => chain[q].z - chain[p].z || q - p) };
  state = 'play'; mistakes = 0; drag = null; stop = null; near = null; slowK = 0; clock = 0;
  startAt = CC.time + WAIT;

}
function hue(h) {
  const f = k => { const m = (k + h / 30) % 12; return Math.round(255 * (0.6 - 0.34 * Math.max(-1, Math.min(m - 3, 9 - m, 1)))); };

}
function relay() { for (const g of L.gaps) g.lay = BR.lay(g, g.slots.map(k => k < 0 ? null : L.hand[k])); }
const xAt = (g, s) => g.dir > 0 ? X1 + s : X2 - s;
// The ground a place takes, in pixels: [left, top, width, height], pips at the bottom, the line on top.
function slotRect(g, i) {
  const a = xAt(g, g.s0 + 1 + 2 * i), b = xAt(g, g.s0 + 3 + 2 * i);
  return [px(Math.min(a, b)), py(g.z + 0.3), 2 * S, 1.55 * S];
}
function put(k, g, i) {
  const other = g.slots[i];
  if (other >= 0 && other !== k) L.where[other] = null;
  if (L.where[k]) L.gaps[L.where[k][0]].slots[L.where[k][1]] = -1;
  g.slots[i] = k; g.since[i] = CC.time; L.where[k] = [g.index, i];
  relay();

}
// The wave has passed over a place: its tile stays.
const locked = (g, i) => L.chain[g.first[i]].at != null;
// Live: the gap whose turn it is, the first that does not hold yet. Its tiles are the hand.
const active = () => L.gaps.findIndex(g => g.lay.joints.some(s => s !== 'ok'));
const shown = k => !live() || L.owner[k] === active();
// A place the player can no longer change: the wave has passed, or it is not its gap's turn.
const fixed = (g, i) => locked(g, i) || (live() && g.index !== active());
// Where a tile tapped in the hand goes: the first empty place on the wave's way. Live, a joint that fails
// comes first: the tile takes the place of the one that does not match.
function nextFree() {
  const g = live() && L.gaps[active()], bad = g ? g.lay.joints.indexOf('bad') : -1;
  if (bad >= 0) { const i = Math.min(g.n - 1, bad); return locked(g, i) ? null : { g, i }; }
  for (const g of L.gaps) for (let i = 0; i < g.n; i++) if (g.slots[i] < 0 && !fixed(g, i)) return { g, i };

}

// What stops the wave at a domino: an empty place under it, or a joint that does not match.
const trouble = it => it.slot && L.gaps[it.slot[0]].slots[it.slot[1]] < 0 ? 'hole'

}
function flick() {
  if (state !== 'play') return;

  if (!live()) drag = null;

function step() {

      near = ahead(NEAR);

      clear = free;

        stop = { i: next, hole: why === 'hole' };
        L.chain[next - 1].rest = stop.hole ? Math.PI / 2 : 0.7;
        endAt = clock + 0.7; pace = 1; drag = null; near = null;
        break;

      it.at = 0.1 + next / RATE;
      tock(next % 7 / 7);
      if (next % 4 === 0) mallet(L.tune[next / 4 % L.tune.length]);
      if (next === L.feed) for (const cell of L.cells) cell.at = it.at + Math.abs(cell.x - it.x) / 0.5 / RATE + 0.08 + cell.r / 40;
      if (next === L.chain.length - 1) { it.rest = Math.PI / 2; endAt = Math.max(it.at + 0.7, ...L.cells.map(cell => cell.at)) + 1; }
      next++;

      if (stop) { state = 'fail'; mistakes++; bonk(); }
      else {
        state = 'won';
        won()[L.n] = Math.max(won()[L.n] || 0, starsNow());
        saveProg();
        [0, 2, 4, 7].forEach((n, k) => mallet(n, 0.16, k * 0.09));
      }
    }

  if (it.at == null || clock < it.at) return 0;

// ---- Drawing
const shades = new Map();
function shade(rgb, b) {
  const q = Math.round(b * 16), key = (rgb[0] << 16 | rgb[1] << 8 | rgb[2]) * 32 + q;
  let s = shades.get(key);
  if (!s) { s = `rgb(${rgb.map(v => Math.min(255, Math.round(v * q / 16))).join(',')})`; shades.set(key, s); }
  return s;
}
const FACES = [[4, 6, 7, 5, 1, 0, 0], [0, 2, 3, 1, -1, 0, 0], [2, 6, 7, 3, 0, 1, 0], [0, 4, 5, 1, 0, -1, 0], [1, 5, 7, 3, 0, 0, 1]];
const LIGHT = [-0.35, 0.85, 0.4];

// A box standing at (x, z), thin along its heading a, tipped forward by `tilt` about its front bottom edge.

function box(ctx, x, z, a, y0, len, wid, hei, tilt, rgb, back) {

function draw(ctx) {

// ---- Input

// The empty or taken place under a point, the nearest first.
