<script>
// A domino tips along its face normal and only hits the dominoes right in front of it.
// It knocks a domino of its own color hit within 65 degrees of its face; an edge hit
// or another color stops it. Each color is one line, kept clear of the others: colors
// only meet at pieces. Slot (dashed outline): empty until you put a domino from the stock
// in it; that domino takes any color and passes on its own. It turns by 45 degrees: where it
// stands at a fork or a crossing, its angle picks the way. Pivot: a quarter turn.
// Turnout: a domino that aims at one of two branches of the same color. Crossing: the
// crossing domino stands side-on in the gap of the other line and blocks it until its
// own line has knocked it down. Start pads: flick the domino to launch the chain.
// Marble: the last domino of a line flicks it along a rail; at the end it knocks the
// domino it meets face-on, or bounces off its side. A flipper on the rail picks its way.
// Comb: a wide plank that starts or stops several lanes at once, whatever their colors.
// A rainbow band is several lanes side by side, started by one comb: they fall together.
// A field shows a picture once its dominoes are down.
const DEG = Math.PI / 180;
const TALL = 1.0, WIDE = 0.55, THIN = 0.13, SP = 0.6, GAP = 0.46;
const REACH = 0.95, LANE = WIDE * 0.66, FACE_OK = Math.cos(65 * DEG), SHIELD = 0.2;
const GRAV = 100, LEAN = 1.2, FLAT = Math.PI / 2, BUDGET = 2;
// Physics clock: x2 gives the pace of real 5 cm dominoes (about 30 per second).
const SPEED = 2;
const NAMES = { '#8b5a2b': 'marron', '#9b5de5': 'violet', '#d9b77e': 'bois', '#e6cf98': 'sable', '#ff8a3d': 'orange', '#4a9cff': 'bleu', '#f4f1e8': 'blanc', '#e8434d': 'rouge', '#4cc36b': 'vert', '#ffd23f': 'jaune', '#ff6fa8': 'rose', '#f0b429': 'doré' };

// ---- Dense curve pieces, as arrays of [x, z]
const add2 = (a, b, k = 1) => [a[0] + b[0] * k, a[1] + b[1] * k];
const dirOf = h => [Math.cos(h), Math.sin(h)];
function bez(p0, p1, p2, p3, n = 800) {
  const out = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    out.push([0, 1].map(k => u * u * u * p0[k] + 3 * u * u * t * p1[k] + 3 * u * t * t * p2[k] + t * t * t * p3[k]));
  }
  return out;
}
function sample(f, t0, t1, n = 4000) { const out = []; for (let i = 0; i <= n; i++) out.push(f(t0 + (t1 - t0) * i / n)); return out; }
function walk(p, h, segs) {
  const out = [p.slice()];
  let [x, z] = p;
  for (const [len, turn] of segs) {
    const n = Math.ceil(len / 0.01);
    for (let i = 0; i < n; i++) { h += turn * DEG / n; x += Math.cos(h) * len / n; z += Math.sin(h) * len / n; out.push([x, z]); }
  }
  return out;
}
// Archimedean spiral from its outer end inward, `gap` between turns. a0 is the angle of
// the outer end; it winds toward smaller angles.
function spiral(c, rOut, rIn, gap, a0) {
  const F = 2 * Math.PI * (rOut - rIn) / gap;
  return sample(f => { const r = rOut - gap * f / (2 * Math.PI), a = a0 - f; return [c[0] + r * Math.cos(a), c[1] + r * Math.sin(a)]; }, 0, F, 6000);
}

// ---- Turning dense paths into dominoes
function path() {
  const p = { pts: [], tags: [] };
  p.add = (pts, tag) => {
    for (const q of pts) {
      const l = p.pts.at(-1);
      if (l && Math.hypot(q[0] - l[0], q[1] - l[1]) < 1e-9) continue;
      p.pts.push(q); p.tags.push(tag);
    }
    return p;
  };
  return p;
}
function arcs(p) {
  p.s = [0];
  for (let i = 1; i < p.pts.length; i++) p.s.push(p.s[i - 1] + Math.hypot(p.pts[i][0] - p.pts[i - 1][0], p.pts[i][1] - p.pts[i - 1][1]));
  p.L = p.s.at(-1);
  return p;
}
function pointAt(p, s) {
  let lo = 0, hi = p.s.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (p.s[m] <= s) lo = m; else hi = m; }
  const k = (s - p.s[lo]) / Math.max(1e-9, p.s[hi] - p.s[lo]);
  return { q: [p.pts[lo][0] + (p.pts[hi][0] - p.pts[lo][0]) * k, p.pts[lo][1] + (p.pts[hi][1] - p.pts[lo][1]) * k], tag: k < 0.5 ? p.tags[lo] : p.tags[hi] };
}
// Dominoes about SP apart, one exactly on each gate, and a gap of 2 * GAP centered on each
// crossing of another line, which the gate fills.
function place(p, out, { gates = [], gaps = [], anchors = [] } = {}) {
  if (!p.s) arcs(p);
  const marks = [{ s: 0 }];
  for (const g of gates) marks.push({ s: g.s, gate: g });
  for (const s of anchors) marks.push({ s });
  for (const s of gaps) { marks.push({ s: s - GAP, gap: true }); marks.push({ s: s + GAP }); }
  marks.push({ s: p.L, end: true });
  marks.sort((a, b) => a.s - b.s);
  const at = [];
  for (let k = 0; k + 1 < marks.length; k++) {
    const a = marks[k], len = marks[k + 1].s - a.s;
    const n = a.gap ? 1 : Math.max(1, Math.round(len / SP));
    for (let i = 0; i < n; i++) at.push({ s: a.s + len * i / n, gate: i === 0 ? a.gate : null });
  }
  at.push({ s: p.L });
  const placed = at.map(({ s, gate }) => { const { q, tag } = pointAt(p, s); return { x: q[0], z: q[1], tag, gate: !!gate, gb: gate ? gate.angB : 0 }; });
  placed.forEach((d, i) => {
    const n = placed[Math.min(i + 1, placed.length - 1)], o = placed[Math.max(i - 1, 0)];
    d.a = Math.atan2(n.z - o.z, n.x - o.x);
    d.color = d.tag.color;
    if (i > 0 && d.tag !== placed[i - 1].tag && d.tag.sw) { d.sw = true; d.good = d.tag.color; d.color = d.tag.def || placed[i - 1].color; d.fixed = !!d.tag.fixed; }
  });
  out.push(...placed);
  return placed;
}
// Points where the path between arc lengths a0..a1 crosses itself between b0..b1.
function crossings(p, [a0, a1], [b0, b1]) {
  if (!p.s) arcs(p);
  const idx = []; let last = -1;
  p.pts.forEach((q, i) => { if (p.s[i] - last >= 0.05 || i === p.pts.length - 1) { idx.push(i); last = p.s[i]; } });
  const A = idx.filter(i => p.s[i] >= a0 && p.s[i] <= a1), B = idx.filter(i => p.s[i] >= b0 && p.s[i] <= b1);
  const found = [];
  for (let j = 0; j + 1 < A.length; j++) {
    const P = p.pts[A[j]], Q = p.pts[A[j + 1]], r = [Q[0] - P[0], Q[1] - P[1]];
    for (let k = 0; k + 1 < B.length; k++) {
      const U = p.pts[B[k]], V = p.pts[B[k + 1]], s = [V[0] - U[0], V[1] - U[1]];
      const den = r[0] * s[1] - r[1] * s[0];
      if (Math.abs(den) < 1e-12) continue;
      const t = ((U[0] - P[0]) * s[1] - (U[1] - P[1]) * s[0]) / den, u = ((U[0] - P[0]) * r[1] - (U[1] - P[1]) * r[0]) / den;
      if (t < 0 || t > 1 || u < 0 || u > 1) continue;
      const angA = Math.atan2(r[1], r[0]), angB = Math.atan2(s[1], s[0]);
      let cross = Math.abs(((angA - angB) / DEG % 180 + 180) % 180);
      cross = Math.min(cross, 180 - cross);
      found.push({ s: p.s[A[j]] + t * (p.s[A[j + 1]] - p.s[A[j]]), sB: p.s[B[k]] + u * (p.s[B[k + 1]] - p.s[B[k]]), angB, cross, pt: [P[0] + r[0] * t, P[1] + r[1] * t] });
    }
  }
  return found;
}
function branchFrom(d, side, turn = 35) {
  const f = dirOf(d.a), pp = [-f[1], f[0]];
  return { p: add2(add2([d.x, d.z], f, 0.55), pp, 0.24 * side), h: d.a + side * turn * DEG };
}
function pivot(d) { d.pivot = true; d.good = d.a; d.a += FLAT; }
const snap = a => Math.round(a / (FLAT / 2)) * (FLAT / 2);
function turnout(d, good, wrong) { d.turnout = [good, wrong]; d.good = good; d.a = wrong; }
// Points where path A crosses path B.
function crossPaths(A, B) {
  arcs(A); arcs(B);
  const thin = q => { const idx = []; let last = -1; q.pts.forEach((v, i) => { if (q.s[i] - last >= 0.05 || i === q.pts.length - 1) { idx.push(i); last = q.s[i]; } }); return idx; };
  const ia = thin(A), ib = thin(B), found = [];
  for (let j = 0; j + 1 < ia.length; j++) {
    const P = A.pts[ia[j]], Q = A.pts[ia[j + 1]], r = [Q[0] - P[0], Q[1] - P[1]];
    for (let k = 0; k + 1 < ib.length; k++) {
      const U = B.pts[ib[k]], V = B.pts[ib[k + 1]], w = [V[0] - U[0], V[1] - U[1]];
      const den = r[0] * w[1] - r[1] * w[0];
      if (Math.abs(den) < 1e-12) continue;
      const t = ((U[0] - P[0]) * w[1] - (U[1] - P[1]) * w[0]) / den, u = ((U[0] - P[0]) * r[1] - (U[1] - P[1]) * r[0]) / den;
      if (t < 0 || t > 1 || u < 0 || u > 1) continue;
      found.push({ s: A.s[ia[j]] + t * (A.s[ia[j + 1]] - A.s[ia[j]]), sB: B.s[ib[k]] + u * (B.s[ib[k + 1]] - B.s[ib[k]]), angB: Math.atan2(w[1], w[0]) });
    }
  }
  return found;
}

// ---- Levels
function lollipop() {
  const W = '#f4f1e8', R = '#e8434d', d = [];
  const sp = spiral([0, -2], 3.6, 1.1, 1.0, FLAT);
  const E = sp[0], top = [E[0] - 1.6, E[1] + 1.5];
  const p = path().add(walk([top[0], top[1] + 5.2], -FLAT, [[5.2, 0]]), { color: W });
  const bend = bez(top, add2(top, [0, -0.9]), add2(E, [-0.9, 0]), E), tR = { color: R, sw: true, def: W };
  p.add(bend.slice(0, 300), { color: W }).add(bend.slice(300), tR).add(sp, tR);
  const all = place(p, d);
  pivot(all[4]);
  const h = { start: all[0], sw: all.find(o => o.sw), piv: all[4] };
  return { name: 'Lollipop', colors: [W, R], dominos: d, h, hot: [h.piv, h.sw], starts: [h.start] };
}

function flower() {
  const G = '#4cc36b', Y = '#ffd23f', P = '#ff6fa8', d = [];
  const c = [0, -3];
  // Yellow heart: a spiral entered from its outer end at the bottom.
  const ys = spiral(c, 2.2, 0.9, 1.0, FLAT), E = ys[0], top = [E[0] - 1.0, E[1] + 1.7];
  const main = path().add(walk([top[0], top[1] + 6.4], -FLAT, [[6.4, 0]]), { color: G });
  const bend = bez(top, add2(top, [0, -0.9]), add2(E, [-0.8, 0]), E), tY = { color: Y, sw: true, def: G };
  main.add(bend.slice(0, 300), { color: G }).add(bend.slice(300), tY).add(ys, tY);
  const stem = place(main, d);
  // Pink petals: a scalloped ring open at the bottom, reached by a branch of the stem.
  const R = 4.7, A = 0.5, ring = th => { const r = R + A * Math.cos(5 * (th + FLAT)); return [c[0] + r * Math.cos(th), c[1] + r * Math.sin(th)]; };
  const th0 = FLAT + 45 * DEG, th1 = FLAT + 315 * DEG, R0 = ring(th0), R1 = ring(th0 + 0.01), tl = Math.hypot(R1[0] - R0[0], R1[1] - R0[1]);
  const b = branchFrom(stem[4], -1, 35), into = [(R1[0] - R0[0]) / tl, (R1[1] - R0[1]) / tl];
  const conn = bez(b.p, add2(b.p, dirOf(b.h), 1.0), add2(R0, into, -1.6), R0), tP = { color: P, sw: true, def: G };
  const petals = path().add(conn.slice(0, 500), { color: G }).add(conn.slice(500), tP).add(sample(ring, th0, th1), tP);
  place(petals, d)[0].a = b.h;
  // A leaf on the right of the stem: a short base, turned the wrong way at its pivot,
  // that splits into the two edges of the leaf.
  const lb = branchFrom(stem[1], 1, 45);
  const leafBase = place(path().add(walk(lb.p, lb.h, [[0.6, 0]]), { color: G }), d);
  leafBase[0].a = lb.h;
  const L1 = leafBase.at(-1), u = dirOf(lb.h), n = [-u[1], u[0]], tip = add2([L1.x, L1.z], u, 3.2);
  for (const side of [-1, 1]) {
    const e = branchFrom(L1, side, 32), end = add2(tip, n, 0.28 * side);
    place(path().add(bez(e.p, add2(e.p, dirOf(e.h), 1.3), add2(end, dirOf(lb.h - side * 30 * DEG), -1.1), end), { color: G }), d)[0].a = e.h;
  }
  pivot(L1);
  return { name: 'Flower', colors: [G, Y, P], dominos: d, h: { start: stem[0], piv: L1 }, hot: [L1, ...d.filter(o => o.sw)], starts: [stem[0]] };
}

// The arrow pierces a pink heart. It owns the crossings, so it must fall first; its tip
// ring then sends the chain into the heart.
let HEART = { s0: 2.4, g: 2.6, turns: 1.45, t0: 1.7, M: [-0.6, -0.4], ang: -40, lt: 7.5, lh: 6.0, h1: 2.0, h2: 2.0 };
function heart(P0 = HEART) {
  const Gd = '#f0b429', P = '#ff6fa8', d = [];
  // Heart curve blended with a circle; the inner turn is rounder so the tip stays gentle.
  const H = (t, k) => {
    const hx = 16 * Math.sin(t) ** 3 / 17, hz = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 17;
    return [(1 - k) * hx + k * Math.sin(t), 1.22 * ((1 - k) * hz - k * Math.cos(t) - 0.19)];
  };
  const Tmax = P0.turns * 2 * Math.PI;
  const at = (T, t) => { const s = P0.s0 + P0.g * T / (2 * Math.PI), q = H(t, 0.42 - 0.14 * T / Tmax); return [s * q[0], s * q[1]]; };
  const hp = sample(T => at(T, P0.t0 + Tmax - T), Tmax, 0, 12000);
  const O = hp[0], into = [hp[30][0] - O[0], hp[30][1] - O[1]], il = Math.hypot(...into);
  const ad = dirOf(P0.ang * DEG), A = add2(P0.M, ad, -P0.lt), B = add2(P0.M, ad, P0.lh), abl = P0.lt + P0.lh;
  const conn = bez(B, add2(B, ad, P0.h1), add2(O, [into[0] / il, into[1] / il], -P0.h2), O);
  const p = path()
    .add(sample(k => add2(A, ad, k * abl), 0, 1, 2000), { color: Gd })
    .add(conn, { color: P, sw: true, def: Gd })
    .add(hp, { color: P });
  arcs(p);
  const x = crossings(p, [0, abl], [abl + 0.01, p.L]);
  const all = place(p, d, { gates: x, gaps: x.map(c => c.sB) });
  const sw = all.find(o => o.sw), h = { start: all[0], sw, heart: all[all.indexOf(sw) + 2] };
  return { name: 'Heart & arrow', colors: [Gd, P], dominos: d, cross: x, arrow: { A, B, ad }, connLen: arcs(path().add(conn, {})).L,
    h, hot: [h.sw], starts: [h.start, h.heart] };
}
function worstTurn(L) {
  let worst = 0;
  for (let i = 1; i < L.dominos.length; i++) {
    const p = L.dominos[i - 1], q = L.dominos[i];
    if (Math.hypot(p.x - q.x, p.z - q.z) > 0.95 || p.pivot || q.pivot) continue;
    let da = Math.abs(((q.a - p.a) % (2 * Math.PI) + 3 * Math.PI) % (2 * Math.PI) - Math.PI);
    da = Math.min(da, Math.PI - da);
    worst = Math.max(worst, da / DEG);
  }
  return worst;
}
// Grid search for a heart where the arrow crosses cleanly and nothing else comes close.
window.__search = () => {
  const out = [];
  for (const turns of [1.15, 1.3, 1.45]) for (const g of [2.2, 2.6]) for (const t0 of [1.4, 1.7, 2.0, 2.3]) for (const ang of [-24, -32, -40])
    for (const mx of [-0.6, 0, 0.6]) for (const mz of [-0.4, 0.3]) for (const h of [1.4, 2.0]) {
      const P0 = { ...HEART, turns, g, t0, ang, M: [mx, mz], h1: h, h2: h };
      const L = heart(P0), xs = L.cross;
      if (xs.length < 2 || xs.some(c => c.sB < L.connLen + 1)) continue;
      const sep = separation(L), minX = Math.min(...xs.map(c => c.cross));
      const sA = xs.map(c => c.s).sort((a, b) => a - b), gapA = Math.min(9, ...sA.slice(1).map((v, i) => v - sA[i]));
      out.push({ P0, n: xs.length, minX: Math.round(minX), gapA: +gapA.toFixed(2), bad: sep.bad.length, worst: sep.worst, turn: Math.round(worstTurn(L)), dn: L.dominos.length,
        score: sep.bad.length * 10 + Math.max(0, 75 - minX) + Math.max(0, worstTurn(L) - 35) * 2 - Math.min(xs.length, 4) * 3 });
    }
  return out.sort((a, b) => a.score - b.score).slice(0, 12);
};

// Hot-air balloon. Order: basket, rope, neck ring N, gold band (it owns the crossings
// with the three stripes), crown ring T, blue down, ring B, yellow up, ring T2, red down
// back to N. N is a fork: set it to red and the red stripe runs first, into the band.
function balloon() {
  const Wh = '#f4f1e8', Gd = '#f0b429', Rd = '#e8434d', Ye = '#ffd23f', Bl = '#4a9cff', d = [];
  const W = z => z <= -5.5 ? Math.sqrt(Math.max(0, 4.6 ** 2 - (z + 5.5) ** 2)) : 1 + 3.6 * Math.cos(Math.PI / 2 * (z + 5.5) / 7);
  const f = 0.5, zT = -9, zB = -1, zBand = -4.5, up = -FLAT, down = FLAT;
  const gore = (k, z0, z1) => sample(z => [k * f * W(z), z], z0, z1, 3000);
  const arch = (a, b, h) => bez(a, add2(a, dirOf(h), 0.95), add2(b, dirOf(h), 0.95), b);
  const hN = -115 * DEG, N = [-2.1, 0.8], nb = branchFrom({ x: N[0], z: N[1], a: hN }, 1, 35);
  // Basket (a U with round corners), then the rope up to the neck.
  const basket = walk([-4.0, 2.6], down, [[0.4, 0], [1.4, -90], [1.8, 0], [1.4, -90], [0.4, 0]]);
  const TR = basket.at(-1);
  const p = path().add(basket, { color: Wh })
    .add(bez(TR, add2(TR, dirOf(up), 1.1), add2(N, dirOf(hN), -1.2), N), { color: Wh });
  const sN = arcs(p).L;
  // Gold: from the neck up the left side, across the band, up the right side.
  const tG = { color: Gd, sw: true, def: Wh }, E0 = [-W(zB), zB];
  p.add(bez(N, add2(N, dirOf(hN), 0.9), add2(E0, dirOf(up), -0.9), E0), tG);
  p.add(sample(z => [-W(z), z], zB, zBand + 0.9, 800), tG);
  const c1 = [-W(zBand + 0.9), zBand + 0.9], c2 = [-W(zBand) + 0.9, zBand];
  p.add(bez(c1, add2(c1, dirOf(up), 0.5), add2(c2, [1, 0], -0.5), c2), tG);
  const c3 = [W(zBand) - 0.9, zBand], c4 = [W(zBand - 0.9), zBand - 0.9];
  p.add(sample(x => [x, zBand], c2[0], c3[0], 1500), tG);
  p.add(bez(c3, add2(c3, [1, 0], 0.5), add2(c4, dirOf(up), -0.5), c4), tG);
  p.add(sample(z => [W(z), z], zBand - 0.9, zT, 1200), tG);
  const sG = arcs(p).L;
  // Crown ring T: gold turns into the blue stripe, down; ring B at the bottom; and so on.
  const tB = { color: Bl, sw: true, def: Gd }, tY = { color: Ye, sw: true, def: Bl }, tR = { color: Rd, sw: true, def: Ye };
  const a1 = arch([W(zT), zT], [f * W(zT), zT], up);
  p.add(a1.slice(0, 400), tG).add(a1.slice(400), tB).add(gore(1, zT, zB), tB);
  const a2 = arch([f * W(zB), zB], [0, zB], down);
  p.add(a2.slice(0, 400), tB).add(a2.slice(400), tY).add(gore(0, zB, zT), tY);
  const a3 = arch([0, zT], [-f * W(zT), zT], up);
  p.add(a3.slice(0, 400), tY).add(a3.slice(400), tR).add(gore(-1, zT, zB), tR);
  const R0 = [-f * W(zB), zB];
  p.add(bez(R0, add2(R0, dirOf(down), 0.6), add2(nb.p, dirOf(nb.h), 0.6), nb.p), tR);
  arcs(p);
  const x = crossings(p, [sN, sG], [sG + 2, p.L]);
  const all = place(p, d, { gates: x, gaps: x.map(c => c.sB), anchors: [sN + 0.01] });
  const ring = all.filter(o => o.sw);
  const rope = all.slice(0, all.indexOf(ring[0]));

  const h = { start: all[0], N: ring[0], T: ring[1], B: ring[2], T2: ring[3], piv };
  return { name: 'Balloon', hard: true, colors: [Wh, Rd, Gd, Bl, Ye], dominos: d, cross: x, envelope: W, h,

}

// Railway. The main line ends on a turnout: left, a double track loops up and over to a
// slot that turns it into the river; right, a single track crosses the river. The river
// owns that crossing, then a second slot at its end sends the chain back along the right
// track to the turnout. Aim the turnout right and the train stops at the river.
function railway() {
  const Wh = '#f4f1e8', Bl = '#4a9cff', d = [];
  const main = place(path().add(walk([-7.2, 3.0], 0, [[4.2, 0]]), { color: Wh }), d);
  const J = { x: -2.4, z: 3.0, a: 0, a0: 0, goodA: -40 * DEG, color: Wh, good: Wh, sw: true, tag: {} };
  d.push(J);
  const L0 = add2([J.x, J.z], dirOf(-40 * DEG), 0.6), R0 = add2([J.x, J.z], dirOf(40 * DEG), 0.6);
  // Right track: east under the river to F.
  const pR = path().add(bez(R0, add2(R0, dirOf(40 * DEG), 0.8), [-0.4, 4.2], [0.4, 4.2]), { color: Wh })
    .add(sample(x => [x, 4.2], 0.4, 6.0, 1500), { color: Wh });
  // Left track: up, then two parallel rails over an arch, merging above the river source.
  const P = [-1.2, 0.4];
  const pL = path().add(bez(L0, add2(L0, dirOf(-40 * DEG), 0.7), add2(P, dirOf(-FLAT), -1.0), P), { color: Wh });
  const left = place(pL, d);
  left[0].a = -40 * DEG;
  const Pd = left.at(-1), hP = -FLAT, c = [0.8, -1.2], rad = 2.0, M = [2.8, 0.4], hM = FLAT;
  const C = path().add(sample(z => [-1.2, z], 0.4 - 1.0, -1.2, 400), {})
    .add(sample(a => [c[0] + rad * Math.cos(a), c[1] + rad * Math.sin(a)], Math.PI, 2 * Math.PI, 2000), {})
    .add(sample(z => [2.8, z], -1.2, M[1] - 1.0, 400), {});

    const nrm = (i) => { const a = C.pts[Math.max(0, i - 1)], b = C.pts[Math.min(C.pts.length - 1, i + 1)], l = Math.hypot(b[0] - a[0], b[1] - a[1]); return [-(b[1] - a[1]) / l, (b[0] - a[0]) / l]; };
    const off = C.pts.map((q, i) => add2(q, nrm(i), 0.5 * k));
    const B0 = add2(add2([Pd.x, Pd.z], dirOf(hP), 0.55), dirOf(hP + FLAT), 0.3 * k), hB = hP + k * 25 * DEG;
    const E = add2(M, dirOf(hM - k * 30 * DEG), -0.6);
    const r = path().add(bez(B0, add2(B0, dirOf(hB), 0.5), add2(off[0], dirOf(hP), -0.5), off[0]), { color: Wh })
      .add(off, { color: Wh })
      .add(bez(off.at(-1), add2(off.at(-1), dirOf(hM), 0.5), add2(E, dirOf(hM - k * 30 * DEG), -0.5), E), { color: Wh });
    const placed = place(r, d);

    rails.push(placed);
  }
  // From the merge: slot 1, the river down under the right track, round, and slot 2.
  const pRiv = path().add(sample(z => [2.8, z], M[1], 6.0, 1500), { color: Bl })
    .add(bez([2.8, 6.0], [2.8, 7.2], [6.4, 7.0], [7.6, 7.0]), { color: Bl })
    .add(bez([7.6, 7.0], [9.2, 7.0], [9.0, 4.2], [7.4, 4.2]), { color: Bl })
    .add(sample(x => [x, 4.2], 7.4, 6.6, 200), { color: Bl });
  const x = crossPaths(pRiv, pR);
  const river = place(pRiv, d, { gates: x });
  river[0].color = Wh;
  const s1 = river[1], s2 = river.at(-1);
  for (const [o, col] of [[s1, Bl], [s2, Wh]]) { o.sw = true; o.good = col; o.color = col; }
  const right = place(pR, d, { gaps: x.map(c => c.sB) });
  right[0].a = 40 * DEG;
  for (const o of d) if (o.gate) o.gb = x[0].angB;
  const riv = sample(z => [2.8, z], M[1] + 0.6, 6.0, 300).concat(bez([2.8, 6.0], [2.8, 7.2], [6.4, 7.0], [7.6, 7.0], 100), bez([7.6, 7.0], [9.2, 7.0], [9.0, 4.2], [7.4, 4.2], 100));
  // Stand the drawing up for the portrait screen: the train comes from the bottom.
  const rot = ([x, z]) => [z, -x];
  for (const o of d) {
    [o.x, o.z] = rot([o.x, o.z]); o.a -= FLAT;
    if (o.gate) o.gb -= FLAT;
    if (o.a0 !== undefined) o.a0 -= FLAT;
    if (o.goodA !== undefined) o.goodA -= FLAT;
  }
  const h = { start: main[0], J, s1, s2, river: river[2] };
  return { name: 'Railway', colors: [Wh, Bl], dominos: d, h, hot: [J, s1, s2], starts: [main[0], river[2]], riverBed: riv.map(rot),
    sleepers: rails[0].map((o, i) => [o, rails[1][i]]).filter(([a, b]) => b && Math.hypot(a.x - b.x, a.z - b.z) < 1.3) };
}

// Kite. The tail runs up into the gold spar, which crosses the blue spar at a slot, then
// turns red at the top: a bow that splits down both upper edges. At the left corner a slot
// turns the edge into the blue spar. The crossing slot belongs to whichever spar it is
// turned along, in that spar's color: the gold spar comes first, so it must be gold and
// upright. The lower edges are painted on the table.
function kite() {
  const Wh = '#f4f1e8', Gd = '#f0b429', Rd = '#e8434d', Bl = '#4a9cff', d = [];
  const tail = bez([-1.4, 10.4], [-1.4, 8.6], [0, 7.6], [0, 5.6]), lt = arcs(path().add(tail, {})).L;
  const p = path().add(tail, { color: Wh }).add(sample(z => [0, z], 5.6, 4.2, 300), { color: Wh })
    .add(sample(z => [0, z], 4.2, -4.4, 3000), { color: Gd, sw: true })
    .add(sample(z => [0, z], -4.4, -8.2, 600), { color: Rd, sw: true });
  const sX = lt + 1.4 + 5.7;
  const main = place(p, d, { gaps: [sX] });
  const F = main.at(-1), ring = main.filter(o => o.sw);
  const outline = [];
  let blue = null, S4 = null;
  for (const side of [-1, 1]) {
    const k = -side, dTL = [k * -4.2 / 6.92, 5.5 / 6.92], C = [k * -4.2, -1.5], C1 = add2(C, dTL, -0.9);
    const b = branchFrom(F, side, 35), bow = walk(b.p, b.h, [[2.45, side * 108]]), E1 = bow.at(-1);
    const edge = path().add(bow, { color: Rd }).add(sample(t => add2(E1, [C1[0] - E1[0], C1[1] - E1[1]], t), 0, 1, 600), { color: Rd });
    if (side === -1) {
      // Round the left corner, then the slot and the blue spar to the right.
      const C2 = [C[0] + 0.9, -1.5], cb = bez(C1, add2(C1, dTL, 0.6), add2(C2, [-0.6, 0]), C2), tB = { color: Bl, sw: true };
      edge.add(cb, { color: Rd }).add(sample(x => [x, -1.5], C2[0], 2.0, 1500), tB);
      const sXb = arcs(edge).L - 2.0;
      const placed = place(edge, d, { gaps: [sXb] });
      placed[0].a = b.h;
      S4 = placed.find(o => o.sw); blue = placed.slice(placed.indexOf(S4));
      outline.push(...placed.slice(0, placed.indexOf(S4)).reverse());
    } else {
      const C2 = add2(C, [-4.2 / 7.74, 6.5 / 7.74], 0.6);
      edge.add(bez(C1, add2(C1, dTL, 0.5), add2(C2, [4.2 / 7.74, -6.5 / 7.74], 0.4), C2), { color: Rd });
      const placed = place(edge, d);
      placed[0].a = b.h;
      outline.push(...placed);
    }
  }
  // The crossing slot: home angle along the gold spar.
  const X = { x: 0, z: -1.5, a: -FLAT, a0: -FLAT, color: Gd, good: Gd, sw: true, gate: true, gb: 0, tag: {} };
  d.push(X);
  const h = { start: main[0], S1: ring[0], S3: ring[1], X, S4 };
  const shape = [...outline.map(o => [o.x * 1.12, -2 + (o.z + 2) * 1.08]), [5.0, -1.2], [0, 6.0], [-5.0, -1.2]];
  return { name: 'Cerf-volant', teach: 'Un croisement appartient à la ligne dans le sens de laquelle il est tourné : elle tombe en premier',
    sol: [[() => h.S1, Gd], [() => h.S3, Rd], [() => h.X, Gd], [() => h.S4, Bl]],
    colors: [Wh, Gd, Rd, Bl], dominos: d, h, hot: [ring[0], X, ring[1], S4], starts: [main[0], blue.at(-1)],
    kite: shape, bows: [tail[250], tail[560]] };
}

// Fish. The tail is three yellow lines that spread and join again. A slot turns the chain
// orange; it splits into the top and the bottom of the body, which join again at the
// mouth, and a serpentine that fills the body while they run. At the mouth the last domino
// flicks a marble (a bubble) up a rail to the slot that starts the waves: that slot must
// face the marble.
function fish() {
  const Ye = '#ffd23f', Or = '#ff8a3d', Bl = '#4a9cff', d = [];
  const dom = (x, z, a, color, more = {}) => { const o = { x, z, a, color, tag: {}, ...more }; d.push(o); return o; };
  const west = Math.PI, a = 4.6, b = 2.7, E = th => [a * Math.cos(th), -b * Math.sin(th)];
  const tanE = th => Math.atan2(-b * Math.cos(th), -a * Math.sin(th));
  // Tail: a start domino, three lines, and the domino where they join.
  const S = dom(10.2, 0, west, Ye), M = [6.2, 0];
  for (const k of [-1, 0, 1]) {
    const B0 = [S.x - 0.55, 0.3 * k], end = add2(M, dirOf(west + k * 30 * DEG), -0.6), hB = west - k * 35 * DEG;
    const line = k === 0 ? path().add(sample(x => [x, 0], B0[0], end[0], 600), { color: Ye })
      : path().add(bez(B0, add2(B0, dirOf(hB), 2.0), add2(end, dirOf(west + k * 30 * DEG), -1.8), end), { color: Ye });
    const pl = place(line, d);
    pl[0].a = k ? hB : west; pl.at(-1).a = west + k * 30 * DEG;
  }
  dom(M[0], 0, west, Ye);
  const S1 = dom(5.6, 0, west, Or, { sw: true, good: Or, a0: west });
  const F = dom(5.0, 0, west, Or);
  // Body: top and bottom halves that join at the mouth.
  const Mm = [-5.3, 0];
  for (const k of [-1, 1]) {
    const B0 = [F.x - 0.55, 0.3 * k], th0 = -k * 35 * DEG, th1 = -k * 155 * DEG, P0 = E(th0), P1 = E(th1);
    const hIn = west - k * 40 * DEG, hEnd = west + k * 30 * DEG, end = add2(Mm, dirOf(hEnd), -0.6);
    const fix = th => k < 0 ? tanE(th) : -tanE(-th);
    const half = path().add(bez(B0, add2(B0, dirOf(hIn), 0.5), add2(P0, dirOf(fix(th0)), -0.5), P0), { color: Or })
      .add(sample(E, th0, th1, 2000), { color: Or })
      .add(bez(P1, add2(P1, dirOf(fix(th1)), 0.5), add2(end, dirOf(hEnd), -0.5), end), { color: Or });
    const pl = place(half, d);
    pl[0].a = hIn; pl.at(-1).a = hEnd;
  }
  // The serpentine: columns that fill the body from the tail toward the head.
  const cols = [2.4, 0.9, -0.6, -2.1], hz = x => b * Math.sqrt(1 - (x / a) ** 2) - 1.45;
  const fp = path().add(bez([F.x - 0.55, 0], [F.x - 1.45, 0], [cols[0], 0.3], [cols[0], -0.6]), { color: Or });
  cols.forEach((x, i) => {
    const up = i % 2 === 0, z0 = i === 0 ? -0.6 : up ? hz(x) : -hz(x), z1 = up ? -hz(x) : hz(x);
    fp.add(sample(z => [x, z], z0, z1, 400), { color: Or });
    if (i + 1 < cols.length) {
      const nx = cols[i + 1], nz = up ? -hz(nx) : hz(nx), sg = up ? -1 : 1;
      fp.add(bez([x, z1], [x, z1 + sg * 0.85], [nx, nz + sg * 0.85], [nx, nz]), { color: Or });
    }
  });
  place(fp, d)[0].a = west;
  // Mouth: the join, one more domino, then the marble on its rail up to the waves.
  dom(Mm[0], 0, west, Or);
  const L1 = dom(Mm[0] - 0.6, 0, west, Or);
  const r0 = [L1.x - 0.5, 0], rail = [...sample(x => [x, 0], r0[0], -6.9, 60), ...bez([-6.9, 0], [-7.5, 0], [-7.9, -0.4], [-7.9, -1.0], 120), ...sample(z => [-7.9, z], -1.0, -4.0, 200)];
  const S2 = dom(-7.9, -4.45, 0, Bl, { sw: true, good: Bl, a0: 0, goodA: -FLAT });
  const wp = path().add(sample(z => [-7.9, z], -5.05, -5.3, 40), { color: Bl })
    .add(bez([-7.9, -5.3], [-7.9, -5.9], [-7.6, -6.2], [-7.0, -6.2]), { color: Bl })
    .add(sample(x => [x, -6.2 + 0.35 * Math.sin((x + 7.0) * 1.1)], -7.0, 8.0, 3000), { color: Bl });
  const waves = place(wp, d);
  waves[0].a = -FLAT;
  const h = { start: S, S1, S2 };
  return { name: 'Fish', colors: [Ye, Or, Bl], dominos: d, h, hot: [S1, S2], starts: [S, waves.at(-1)],
    marbles: [{ rail, launcher: L1, target: S2 }], body: [a, b] };
}

// Under the sea: a big scene. The sand floor starts the chain: three rows run east
// together. The top row climbs the right seaweed, turns into the fish tail, and the fish
// fills with its serpentine while its outline and dorsal fin fall. A bubble (marble) climbs
// from the mouth to the slot that starts the waves, which run to the sun spiral. A fixed
// ring sends a second seaweed up on the left. Two slots to fill: orange for the body,
// blue for the waves, turned to face the bubble.
function sea() {
  const Sa = '#e6cf98', Gr = '#4cc36b', Ye = '#ffd23f', Or = '#ff8a3d', Bl = '#4a9cff', d = [];
  const dom = (x, z, a, color, more = {}) => { const o = { x, z, a, color, tag: {}, ...more }; d.push(o); return o; };
  const west = Math.PI, east = 0;
  const fixed = color => ({ color, sw: true, fixed: true });
  // Sand rows, the top one going on up the right seaweed into the tail.
  const S = dom(-8.4, 9.4, east, Sa);
  let floor = null;
  for (const k of [-1, 0, 1]) {
    const z = 9.4 + 1.2 * k, B0 = [S.x + 0.55, 9.4 + 0.3 * k], hB = k * 35 * DEG, wob = x => z + 0.16 * Math.sin(x * 1.2 + k);
    const row = path();
    if (k) row.add(bez(B0, add2(B0, dirOf(hB), 0.8), [S.x + 1.9, wob(S.x + 2.7)], [S.x + 2.7, wob(S.x + 2.7)]), { color: Sa });
    else row.add([B0, [S.x + 2.7, wob(S.x + 2.7)]], { color: Sa });
    row.add(sample(x => [x, wob(x)], S.x + 2.7, 8.2, 2000), { color: Sa });
    if (k === -1) {
      const e = [8.2, wob(8.2)], weed = z2 => [10.0 + 0.35 * Math.sin(z2 * 1.1), z2];
      row.add(bez(e, add2(e, [1, 0], 0.9), add2(weed(6.4), [0, 1], 0.9), weed(6.4)), { color: Sa });
      const tG = fixed(Gr);
      row.add(sample(weed, 6.4, -1.6, 2500), tG);
      const w1 = weed(-1.6);
      row.add(bez(w1, add2(w1, [0, -1], 0.8), [9.6, -3.0], [8.9, -3.0]), tG);
      row.add(sample(x => [x, -3.0], 8.9, 8.3, 60), fixed(Ye));
    }
    const placed = place(row, d);
    placed[0].a = k ? hB : east;
    if (k === -1) floor = placed;
  }
  // Left seaweed, through a fixed ring beside the floor.
  const D = floor.reduce((m, o) => Math.abs(o.x + 6.3) < Math.abs(m.x + 6.3) ? o : m), lb = branchFrom(D, -1, 40);
  const lw = path().add(bez(lb.p, add2(lb.p, dirOf(lb.h), 0.7), [-5.6, 6.3], [-5.6, 5.6]), { color: Gr })
    .add(sample(z => [-5.6 + 0.4 * Math.sin(z * 1.2), z], 5.6, 1.4, 1500), { color: Gr });
  const left = place(lw, d);
  Object.assign(left[0], { a: lb.h, sw: true, fixed: true, good: Gr });
  // The tail: three yellow lines from the tail stem, joining before the body.
  const T0 = floor.at(-1), c = [-1.8, -3.0], a = 4.8, b = 3.0, M = [c[0] + a + 1.6, c[1]];
  const E = th => [c[0] + a * Math.cos(th), c[1] - b * Math.sin(th)], tanE = th => Math.atan2(-b * Math.cos(th), -a * Math.sin(th));
  for (const k of [-1, 0, 1]) {
    const B0 = [T0.x - 0.55, c[1] + 0.3 * k], end = add2(M, dirOf(west + k * 30 * DEG), -0.6), hB = west - k * 35 * DEG;
    const line = k === 0 ? path().add(sample(x => [x, c[1]], B0[0], end[0], 600), { color: Ye })
      : path().add(bez(B0, add2(B0, dirOf(hB), 1.6), add2(end, dirOf(west + k * 30 * DEG), -1.4), end), { color: Ye });
    const pl = place(line, d);
    pl[0].a = k ? hB : west; pl.at(-1).a = west + k * 30 * DEG;
  }
  dom(M[0], c[1], west, Ye);
  const S1 = dom(M[0] - 0.6, c[1], west, Or, { sw: true, good: Or, a0: west });
  const F = dom(M[0] - 1.2, c[1], west, Or);
  // Body halves joining at the mouth; a dorsal fin off the top half.
  const Mm = [c[0] - a - 0.7, c[1]];
  for (const k of [-1, 1]) {
    const B0 = [F.x - 0.55, c[1] + 0.3 * k], th0 = -k * 35 * DEG, th1 = -k * 155 * DEG, P0 = E(th0), P1 = E(th1);
    const hIn = west - k * 40 * DEG, hEnd = west + k * 30 * DEG, end = add2(Mm, dirOf(hEnd), -0.6);
    const fix = th => k < 0 ? tanE(th) : -tanE(-th) - 2 * Math.atan2(0, -1) * 0;
    const tb = th => k < 0 ? tanE(th) : Math.atan2(b * Math.cos(-th), -a * Math.sin(-th));
    const half = path().add(bez(B0, add2(B0, dirOf(hIn), 0.5), add2(P0, dirOf(tb(th0)), -0.5), P0), { color: Or })
      .add(sample(E, th0, th1, 2000), { color: Or })
      .add(bez(P1, add2(P1, dirOf(tb(th1)), 0.5), add2(end, dirOf(hEnd), -0.5), end), { color: Or });
    const pl = place(half, d);
    pl[0].a = hIn; pl.at(-1).a = hEnd;
    if (k === -1) {
      const Df = pl.reduce((m, o) => Math.abs(o.x - (c[0] + 1.2)) < Math.abs(m.x - (c[0] + 1.2)) && o.z < c[1] ? o : m), fb = branchFrom(Df, 1, 35);
      place(path().add(walk(fb.p, fb.h, [[0.9, 0], [2.6, -95], [0.6, 0]]), { color: Or }), d)[0].a = fb.h;
    }
  }
  const cols = [2.4, 0.9, -0.6, -2.1].map(x => c[0] + x), hz = x => b * Math.sqrt(1 - ((x - c[0]) / a) ** 2) - 1.45;
  const fp = path().add(bez([F.x - 0.55, c[1]], [F.x - 1.45, c[1]], [cols[0], c[1] + 0.3], [cols[0], c[1] - 0.6]), { color: Or });
  cols.forEach((x, i) => {
    const up = i % 2 === 0, z0 = i === 0 ? c[1] - 0.6 : c[1] + (up ? hz(x) : -hz(x)), z1 = c[1] + (up ? -hz(x) : hz(x));
    fp.add(sample(z => [x, z], z0, z1, 400), { color: Or });
    if (i + 1 < cols.length) {
      const nx = cols[i + 1], nz = c[1] + (up ? -hz(nx) : hz(nx)), sg = up ? -1 : 1;
      fp.add(bez([x, z1], [x, z1 + sg * 0.85], [nx, nz + sg * 0.85], [nx, nz]), { color: Or });
    }
  });
  place(fp, d)[0].a = west;
  // Mouth, the bubble rail, the waves and the sun.
  dom(Mm[0], c[1], west, Or);
  const L1 = dom(Mm[0] - 0.6, c[1], west, Or);
  const r0 = [L1.x - 0.5, c[1]], rx = r0[0] - 1.3;
  const rail = [...sample(x => [x, c[1]], r0[0], r0[0] - 0.4, 40), ...bez([r0[0] - 0.4, c[1]], [rx + 0.3, c[1]], [rx, c[1] - 0.3], [rx, c[1] - 0.9], 120), ...sample(z => [rx, z], c[1] - 0.9, -8.8, 300)];
  const S2 = dom(rx, -9.25, 0, Bl, { sw: true, good: Bl, a0: 0, goodA: -FLAT });
  const sun = spiral([5.2, -14.6], 2.0, 0.9, 0.9, 0);
  const wp = path().add(sample(z => [rx, z], -9.85, -10.1, 40), { color: Bl })
    .add(bez([rx, -10.1], [rx, -10.7], [rx + 0.3, -10.9], [rx + 0.9, -10.9]), { color: Bl })
    .add(sample(x => [x, -10.9 + 0.35 * Math.sin((x - rx) * 1.1)], rx + 0.9, 5.6, 4000), { color: Bl });
  const we = [5.6, -10.9 + 0.35 * Math.sin((5.6 - rx) * 1.1)], tY = fixed(Ye), sb = bez(we, add2(we, [1, 0], 1.0), [7.2, -12.0], [7.2, -12.9]);
  wp.add(sb.slice(0, 400), { color: Bl }).add(sb.slice(400), tY).add(sample(z => [7.2, z], -12.9, -14.6, 200), tY).add(sun, tY);
  const waves = place(wp, d);
  waves[0].a = -FLAT;
  const h = { start: S, S1, S2 };
  return { name: 'Sous la mer', teach: 'Une grande scène : tout ce que tu as appris', sol: [[() => S1, Or], [() => S2, Bl, 'turn', 'turn']],
    colors: [Sa, Gr, Ye, Or, Bl], dominos: d, h, hot: [S1, S2], starts: [S, left.at(-1)],
    marbles: [{ rail, launcher: L1, target: S2 }], scene: { c, a, b, sun: [5.2, -14.6], rx } };
}

// Rainbow. A thick green path (three lanes from a comb) climbs a little pyramid of steps and
// ends on a comb that flicks a marble. The rail rises over a hump, then a flipper sends the
// marble either to the rainbow's comb or into a cup. The rainbow is six lanes that fall
// together over the arch and land on the comb of a white field, which shows a smiling sun
// once it is down.
function rainbow() {
  const Gr = '#4cc36b', Wd = '#d9b77e', Wh = '#f4f1e8', d = [];
  const dom = (x, z, a, color, more = {}) => { const o = { x, z, a, color, tag: {}, ...more }; d.push(o); return o; };
  const C = [-0.5, -3.4], north = -FLAT, south = FLAT, steps = [];
  // Thick path with its pyramid.
  const S = dom(-8.2, 10.62, 0, Gr);
  dom(-7.6, 10.62, 0, Wd, { comb: true, wide: 1.9 });
  const hill = x => Math.max(0, 0.9 - Math.abs(x + 1.1) * 0.4);
  for (const k of [-1, 0, 1]) {
    const z = 10.62 + 0.62 * k;
    for (const o of place(path().add(sample(x => [x, z], -7.0, 4.0, 1500), { color: Gr }), d)) {
      o.a = 0; o.y = hill(o.x);
      if (o.y > 0.02) steps.push({ x: o.x, z: o.z, a: 0, h: o.y });
    }
  }
  const launcher = dom(4.6, 10.62, 0, Wd, { comb: true, wide: 1.9 });
  // Rainbow lanes over the arch, from the right foot comb to the left foot.
  const colors = ['#9b5de5', '#4a9cff', '#4cc36b', '#ffd23f', '#ff8a3d', '#e8434d'];
  const RC = dom(C[0] + 5.05, C[1] + 0.6, north, Wd, { comb: true, wide: 3.92 });
  colors.forEach((col, k) => {
    const r = 3.5 + 0.62 * k;
    const lane = path().add(sample(th => [C[0] + r * Math.cos(th), C[1] - r * Math.sin(th)], 0, Math.PI, 3000), { color: col })
      .add(sample(z => [C[0] - r, z], C[1], C[1] + 0.6, 40), { color: col });
    for (const o of place(lane, d)) o.band = true;
  });
  // The field and its comb; once down it shows a smiling sun.
  const cols = 14, rows = 13, x0 = C[0] - 6.6, z0 = C[1] + 1.8;
  dom(x0 + (cols - 1) * 0.31, C[1] + 1.2, south, Wd, { comb: true, wide: (cols - 1) * 0.62 + 0.6 });
  const sunPix = (X, Z) => {
    const r = Math.hypot(X, Z), ang = Math.atan2(Z, X);
    if (Math.hypot(X + 0.95, Z + 0.75) < 0.42 || Math.hypot(X - 0.95, Z + 0.75) < 0.42) return '#2b2440';
    if (r > 0.95 && r < 1.6 && Z > 0.2 && Math.abs(r - 1.3) < 0.32) return '#2b2440';
    if (r < 2.4) return '#ffd23f';
    if (r < 2.85) return '#ff8a3d';
    if (r < 3.7 && ((ang + 8) % (Math.PI / 4)) < 0.3) return '#ff8a3d';
    return '#4a9cff';
  };
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
    const X = (i - (cols - 1) / 2) * 0.62, Z = (j - (rows - 1) / 2) * 0.55;
    dom(x0 + i * 0.62, z0 + j * 0.55, south, Wh, { rev: sunPix(X, Z) });
  }
  // Rail: east, north over a hump, then a flipper: left to the rainbow comb, right to a cup.
  const hump = z => z < 9.0 && z > 4.0 ? 1.1 * Math.sin(Math.PI * (9.0 - z) / 5.0) : 0;
  const trunk = [...sample(x => [x, 10.62, 0], 5.1, 6.4, 60), ...bez([6.4, 10.62], [7.0, 10.62], [7.3, 10.3], [7.3, 9.7], 120).map(q => [...q, 0]),
    ...sample(z => [7.3, z, hump(z)], 9.7, 2.0, 600)];
  const toRC = [...bez([7.3, 2.0], [7.3, 0.4], [RC.x, 0.0], [RC.x, -1.6], 300).map(q => [...q, 0]), ...sample(z => [RC.x, z, 0], -1.6, RC.z + 0.5, 60)];
  const toCup = bez([7.3, 2.0], [7.3, 1.1], [8.2, 0.6], [9.0, 0.6], 200).map(q => [...q, 0]);
  const cup = { x: 9.3, z: 0.6, a: 0, cup: true, state: 'up', shake: -9, flash: -9 };
  const flipper = { x: 7.3, z: 2.0, a: north, i: 999, state: 'up', flipper: true, pos: 1, good: 0, dirs: [-120 * DEG, -60 * DEG] };
  const h = { start: S, flipper };
  return { name: 'Arc-en-ciel et soleil', teach: 'Escalier, rail, arc-en-ciel et champ réunis', sol: [[() => flipper, 'turn']],
    colors: [Gr, ...colors, Wh], dominos: d, h, hot: [flipper], starts: [S], steps,
    marbles: [{ trunk, branches: [toRC, toCup], flipper, targets: [RC, cup], launcher }], sky: C };
}

// ---- Painted shapes on the table
const rectP = (x0, z0, x1, z1) => [[x0, z0], [x1, z0], [x1, z1], [x0, z1]];
const circP = (x, z, r, n = 32) => sample(t => [x + r * Math.cos(t), z + r * Math.sin(t)], 0, 2 * Math.PI * (1 - 1 / n), n - 1);
const SKY = 0x2c3d6b, GRASS = 0x2f5a3c;

// Two lines from a fork domino F that join again at M: one bulging up, one down.
function lens(F, M, up, down, color, d) {
  for (const [k, bulge] of [[-1, up], [1, down]]) {
    const B0 = [F.x + 0.55, F.z + 0.3 * k], hB = k * 35 * DEG, hE = -k * 30 * DEG, E = add2([M.x, M.z], dirOf(hE), -0.6);
    const Pk = [(F.x + M.x) / 2, F.z + k * bulge], hw = (M.x - F.x) / 4;
    const pl = place(path().add(bez(B0, add2(B0, dirOf(hB), 1.0), [Pk[0] - hw, Pk[1]], Pk), { color })
      .add(bez(Pk, [Pk[0] + hw, Pk[1]], add2(E, dirOf(hE), -1.0), E), { color }), d);
    pl[0].a = hB; pl.at(-1).a = hE;
  }
}

function snail() {
  const Or = '#ff8a3d', d = [];
  const c = [1.4, -2.2], sp = spiral(c, 4.2, 1.1, 1.0, FLAT), E = sp[0];
  const all = place(path().add(sample(x => [x, E[1]], -6.2, E[0], 1500), { color: Or }).add(sp, { color: Or }), d);
  return { name: 'Escargot', teach: 'Donne une pichenette au domino posé sur le socle orange', sol: [], colors: [Or], dominos: d, h: { start: all[0] }, hot: [], starts: [all[0]],
    paint: [[rectP(-11, -9, 11, 2.6), SKY], [rectP(-11, 2.6, 11, 6), GRASS], [[[-7.2, 1.4], [1.4, 1.4], [2.6, 2.9], [-7.4, 2.9]], 0x6b4a3a],
      [[[-6.9, 1.5], [-7.6, -0.6], [-7.3, -0.6], [-6.5, 1.5]], 0x6b4a3a], [[[-6.2, 1.5], [-6.0, -0.8], [-5.7, -0.8], [-5.8, 1.5]], 0x6b4a3a],
      [circP(-7.45, -0.75, 0.3), 0xf4f1e8], [circP(-5.85, -0.95, 0.3), 0xf4f1e8]] };
}

function hills() {
  const G = '#4cc36b', d = [], z = 4.5;
  const a = place(path().add(sample(x => [x, z], -7.4, -5.8, 300), { color: G }), d);
  lens(a.at(-1), { x: 0.6, z }, 6.2, 0.9, G, d);
  const b = place(path().add(sample(x => [x, z], 0.6, 1.8, 300), { color: G }), d);
  lens(b.at(-1), { x: 6.6, z }, 3.4, 0.9, G, d);
  place(path().add(sample(x => [x, z], 6.6, 7.8, 300), { color: G }), d);
  return { name: 'Collines', teach: 'Une ligne peut se séparer en deux puis se rejoindre', sol: [], colors: [G], dominos: d, h: { start: a[0] }, hot: [], starts: [a[0]],
    paint: [[rectP(-10, -8, 10, 4.6), SKY], [rectP(-10, 4.6, 10, 8), GRASS], [circP(5.6, -4.2, 1.3), 0x8a6a2a]] };
}

function rainbowSmall() {
  const Wh = '#f4f1e8', Wd = '#d9b77e', d = [], C = [0, -1.5];
  const colors = ['#9b5de5', '#4a9cff', '#4cc36b', '#ffd23f', '#e8434d'], r0 = 2.8, mid = r0 + 0.62 * 2;
  const start = place(path().add(sample(z => [C[0] + mid, z], C[1] + 4.8, C[1] + 1.2, 400), { color: Wh }), d);
  d.push({ x: C[0] + mid, z: C[1] + 0.6, a: -FLAT, color: Wd, tag: {}, comb: true, wide: 5 * 0.62 + 0.2 });
  colors.forEach((col, k) => {
    const r = r0 + 0.62 * k;
    const lane = path().add(sample(th => [C[0] + r * Math.cos(th), C[1] - r * Math.sin(th)], 0, Math.PI, 3000), { color: col })
      .add(sample(zz => [C[0] - r, zz], C[1], C[1] + 0.8, 40), { color: col });
    for (const o of place(lane, d)) o.band = true;
  });
  return { name: 'Arc-en-ciel', teach: 'Une planche en bois lance plusieurs voies d’un coup', sol: [], colors: [Wh, ...colors], dominos: d, h: { start: start[0] }, hot: [], starts: [start[0]],
    paint: [[rectP(-9, -9, 9, 5), SKY], [circP(-mid - 0.6, C[1] + 1.4, 1.4), 0xdfe6f5], [circP(-mid + 0.7, C[1] + 1.6, 1.1), 0xdfe6f5], [circP(mid + 1.6, C[1] + 1.9, 1.0), 0xdfe6f5]] };
}

function tree() {
  const Bn = '#8b5a2b', G = '#4cc36b', Rd = '#e8434d', d = [];
  const c = [0.6, -3.6], sp = spiral(c, 3.4, 1.0, 0.9, FLAT), E = sp[0], top = [E[0] - 1.6, E[1] + 1.5];
  const p = path().add(walk([top[0], top[1] + 5.0], -FLAT, [[5.0, 0]]), { color: Bn });
  const bend = bez(top, add2(top, [0, -0.9]), add2(E, [-0.9, 0]), E), tG = { color: G, sw: true };
  p.add(bend.slice(0, 300), { color: Bn }).add(bend.slice(300), tG).add(sp, tG);
  const all = place(p, d);
  const br = branchFrom(all[3], -1, 35);
  place(path().add(walk(br.p, br.h, [[1.0, 0], [1.4, 25]]), { color: Bn }), d)[0].a = br.h;
  const slot = all.find(o => o.sw);
  return { name: 'Arbre', teach: 'Remplis la case vide : choisis la bonne couleur dans le stock', sol: [[() => slot, G]], extra: [Rd],
    colors: [Bn, G, Rd], dominos: d, h: { start: all[0], slot }, hot: [slot], starts: [all[0]],
    paint: [[rectP(-8, -9, 9, 3.5), SKY], [rectP(-8, 3.5, 9, 7), GRASS], ...[[-2.4, -6.6], [3.6, -6.4], [4.0, -1.6], [-2.6, -1.8]].map(([x, z]) => [circP(x, z, 0.35), 0xc0392b])] };
}

function mountains() {
  const Wh = '#f4f1e8', d = [];
  const P = [[-7, 5], [-3.4, 1.4], [-2.2, 1.4], [0.6, 4.2], [3.6, 1.2], [4.8, 1.2], [7.6, 4.0]];
  const seg = (a, b, n = 400) => sample(t => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t], 0, 1, n);
  const V1 = add2(P[3], dirOf(45 * DEG), -1.0), V2 = add2(P[3], dirOf(-45 * DEG), 1.0);
  const p = path().add(seg(P[0], P[1]), { color: Wh }).add(seg(P[1], P[2]), { color: Wh }).add(seg(P[2], V1), { color: Wh })
    .add(bez(V1, add2(V1, dirOf(45 * DEG), 0.6), add2(V2, dirOf(-45 * DEG), -0.6), V2), { color: Wh })
    .add(seg(V2, P[4]), { color: Wh }).add(seg(P[4], P[5]), { color: Wh }).add(seg(P[5], P[6]), { color: Wh });
  arcs(p);
  const sAt = q => { let best = 0, bd = 9; p.pts.forEach((v, i) => { const e = Math.hypot(v[0] - q[0], v[1] - q[1]); if (e < bd) { bd = e; best = p.s[i]; } }); return best; };
  const all = place(p, d, { anchors: [sAt(P[1]), sAt(P[4])] });
  const slots = [P[1], P[4]].map(q => all.reduce((m, o) => Math.hypot(o.x - q[0], o.z - q[1]) < Math.hypot(m.x - q[0], m.z - q[1]) ? o : m));
  for (const o of slots) Object.assign(o, { sw: true, good: Wh, a: -45 * DEG, a0: -45 * DEG, goodA: 0 });
  return { name: 'Montagnes', teach: 'Tourne la case pour qu’elle suive le virage de la ligne', sol: slots.map(o => [() => o, Wh, 'turn']),
    colors: [Wh], dominos: d, h: { start: all[0] }, hot: slots, starts: [all[0]],
    paint: [[rectP(-9, -6, 9, 6.5), SKY], [[...P.map(([x, z]) => [x, z + 0.4]), [7.6, 6.5], [-7, 6.5]], 0x4a5578], [circP(-5.2, -2.6, 1.2), 0x8a6a2a]] };
}

function house() {
  const Wh = '#f4f1e8', Wd = '#d9b77e', d = [];
  const cols = 16, rows = 15, x0 = -(cols - 1) * 0.31, z0 = -3.6;
  const S = { x: 0, z: z0 - 1.2, a: FLAT, color: Wh, tag: {} };
  d.push(S);
  d.push({ x: 0, z: z0 - 0.6, a: FLAT, color: Wd, tag: {}, comb: true, wide: (cols - 1) * 0.62 + 0.6 });
  const pix = (X, Z) => {
    if (Math.hypot(X + 3.3, Z + 2.8) < 1.0) return '#ffd23f';
    if (Z > 3.0) return '#4cc36b';
    if (Z < -0.2 && Z > -2.7 && Math.abs(X) < 3.0 * (Z + 2.7) / 2.5) return '#e8434d';
    if (Z >= -0.2 && Math.abs(X) <= 2.4) {
      if (Math.abs(X) < 0.5 && Z > 1.3) return '#8b5a2b';
      if (X > 0.9 && X < 1.95 && Z > 0.3 && Z < 1.3) return '#bfe6ff';
      if (X < -0.9 && X > -1.95 && Z > 0.3 && Z < 1.3) return '#bfe6ff';
      return '#e6cf98';
    }
    return '#4a9cff';
  };
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
    const X = (i - (cols - 1) / 2) * 0.62, Z = (j - (rows - 1) / 2) * 0.55;
    d.push({ x: x0 + i * 0.62, z: z0 + j * 0.55, a: FLAT, color: Wh, tag: {}, rev: pix(X, Z) });
  }
  return { name: 'Maison', teach: 'Un champ blanc révèle une image en tombant', sol: [], colors: [Wh], dominos: d, h: { start: S }, hot: [], starts: [S],
    paint: [[rectP(-6.5, -6.5, 6.5, 5.0), 0x3a3550]] };
}

function lake() {
  const G = '#4cc36b', Bl = '#4a9cff', d = [];
  const p = path().add(sample(x => [x, -7.0], -5.6, -3.0, 600), { color: G })
    .add(bez([-3.0, -7.0], [-1.6, -7.0], [-0.6, -4.2], [0.8, -4.2]), { color: G });
  const hill = place(p, d);
  const L = { x: 1.4, z: -4.2, a: 0, color: G, tag: {} };
  d.push(L);
  const hump = z => z > -3.3 && z < 0.2 ? 0.9 * Math.sin(Math.PI * (z + 3.3) / 3.5) : 0;
  const trunk = [...sample(x => [x, -4.2, 0], 1.9, 2.6, 60), ...bez([2.6, -4.2], [3.1, -4.2], [3.4, -3.9], [3.4, -3.3], 120).map(q => [...q, 0]),
    ...sample(z => [3.4, z, hump(z)], -3.3, 0.6, 500)];
  const W0 = { x: 0.3, z: 2.4, a: Math.PI, color: Bl, tag: {} };
  const toLake = [...bez([3.4, 0.6], [3.4, 1.8], [1.9, 2.4], [1.1, 2.4], 200).map(q => [...q, 0]), ...sample(x => [x, 2.4, 0], 1.1, W0.x + 0.5, 40)];
  const toCup = bez([3.4, 0.6], [3.4, 1.3], [4.3, 1.6], [5.1, 1.6], 200).map(q => [...q, 0]);
  const cup = { x: 5.4, z: 1.6, a: 0, cup: true, state: 'up', shake: -9, flash: -9 };
  const flipper = { x: 3.4, z: 0.6, a: FLAT, i: 998, state: 'up', flipper: true, pos: 1, good: 0, dirs: [120 * DEG, 60 * DEG] };
  d.push(W0);
  const w = place(path().add(sample(x => [x, 2.4 + 0.2 * Math.sin(x * 1.4)], W0.x - 0.6, -5.4, 2000), { color: Bl })
    .add(bez([-5.4, 2.4 + 0.2 * Math.sin(-5.4 * 1.4)], [-6.4, 2.4], [-6.4, 3.8], [-5.4, 3.8]), { color: Bl })
    .add(sample(x => [x, 3.8 + 0.2 * Math.sin(x * 1.4 + 1)], -5.4, 2.6, 2000), { color: Bl }), d);
  return { name: 'Lac', teach: 'La bille roule sur son rail : règle l’aiguillage', sol: [[() => flipper, 'turn']], colors: [G, Bl], dominos: d,
    h: { start: hill[0], flipper }, hot: [flipper], starts: [hill[0]],
    marbles: [{ trunk, branches: [toLake, toCup], flipper, targets: [W0, cup], launcher: L }],
    paint: [[rectP(-8, -10, 8, 0.8), SKY], [[[-7, -6.4], [-3, -6.4], [1.9, -3.6], [6.5, -3.6], [6.5, 0.8], [-7, 0.8]], GRASS], [circP(-1.4, 3.1, 1, 48).map(([x, z]) => [-1.4 + (x + 1.4) * 5.6, 3.1 + (z - 3.1) * 1.7]), 0x2b4a7d]] };
}


// ---- Gold dominoes: numbered, they must fall in order 1, 2, 3... A gold domino is a
// domino of its line, only painted gold.
const pick = (list, ...ks) => ks.map(k => list[Math.min(list.length - 1, Math.round(k))]);
function setGolds(list) { list.forEach((d, k) => { d.gold = k + 1; }); return list; }

function clock() {
  const Bl = '#4a9cff', d = [], c = [0, -0.6], R = 4.2;
  const C = 2 * Math.PI * R, a0 = Math.PI / 2, span = 2 * Math.PI * (1 - SP / C);
  const all = place(path().add(sample(t => [c[0] + R * Math.cos(a0 + t), c[1] + R * Math.sin(a0 + t)], 0, span, 3000), { color: Bl }), d);
  const N = all.length;
  // Numbers go one way round; the 4 sits right next to the pad on the other side, to tempt.
  setGolds(pick(all, N * 0.3, N * 0.48, N * 0.66, N * 0.86));
  const hand = (ang, len, w) => { const f = dirOf(ang), q = [-f[1] * w, f[0] * w]; return [add2(c, q), add2(add2(c, f, len), q), add2(add2(c, f, len), q, -1), add2(c, q, -1)]; };
  return { name: 'Horloge', teach: 'Les dorés doivent tomber dans l’ordre 1, 2, 3, 4 : choisis le sens de la pichenette', sol: [], colors: [Bl], dominos: d,
    h: { start: all[0], sign: 1 }, hot: [], starts: [all[0]], golds: 4,
    paint: [[rectP(-9, -9, 9, 6), SKY], [circP(c[0], c[1], R + 0.9, 64), 0x3a4a7a], [circP(c[0], c[1], R - 0.8, 64), 0x44558a],
      [hand(-FLAT, 2.6, 0.12), 0xf4f1e8], [hand(-0.3, 1.8, 0.16), 0xf4f1e8], [circP(c[0], c[1], 0.3), 0xf4f1e8]] };
}

// Three arms meet at a small triangle: a chain coming down one arm starts the two others
// at the same time. The dominoes nearest the crossing fall first.
function clover() {
  const Wh = '#f4f1e8', d = [], c = [0, -0.4], r = 0.38;
  const arms = [[FLAT, 5.2], [FLAT + 120 * DEG, 6.4], [FLAT - 120 * DEG, 4.4]].map(([ang, len]) => {
    const f = dirOf(ang);
    return place(path().add(sample(t => add2(c, f, r + t), 0, len, 800), { color: Wh }), d);
  });
  const [A, B, Cc] = arms, at = (arm, dist) => arm[Math.round(dist / SP)];
  // From C's tip: C, then B near the crossing, then A, then B's far end. Any other start breaks the order.
  setGolds([at(Cc, 3.0), at(B, 1.2), at(A, 2.7), at(B, 5.2)]);
  const leaf = (ang, len) => sample(t => { const f = dirOf(ang), q = [-f[1], f[0]], k = (1 - Math.cos(t)) / 2; return add2(add2(c, f, 0.6 + len * k), q, 1.35 * Math.sin(t) * Math.sin(Math.PI * k) ** 0.6); }, 0, 2 * Math.PI, 80);
  const tips = arms.map(a => a.at(-1));

function drawPanel(ctx, e) {

  ctx.fillStyle = '#cfd5f5'; ctx.font = 'bold 34px Segoe UI, Arial'; ctx.textAlign = 'center';

      ctx.fillStyle = 'rgba(0,0,0,0.25)'; for (const yy of [-23, 23]) { ctx.beginPath(); ctx.arc(0, yy, 5, 0, Math.PI * 2); ctx.fill(); }

function select(d) {

}

  if (!sel || !b) return;
  pressed = { key: b.key, t: CC.time };
  if (sel.spot) { putPot(sel, b.k); return; }
  if (b.id === 'turn') turn(sel);
  else if (b.id === 'item') { if (b.it) fill(sel, b.it); }

}

// ---- Settings
function fill(d, it) {
  if (!d.empty) emptySlot(d, true);
  it.slot = d; d.item = it; d.color = it.color; d.empty = false; d.dropT = CC.time;
  d.a = d.va = snap(d.a0);
  note(d, NAMES[it.color], it.color);

}
function emptySlot(d, quiet) {
  if (d.item) d.item.slot = null;

}
function turn(d) {
  if (d.flipper) { d.pos = 1 - d.pos; note(d, 'Aiguillage changé', '#ffffff'); CC.sfx('select', { p: 0.3 }); return; }
  if (d.slot) { d.a += FLAT / 2; note(d, 'Tourné', '#ffffff'); }
  else { d.a += FLAT; d.va = d.a - FLAT * 0.999; note(d, 'Tourné', '#ffffff'); }

function retry() { tries++; resetDominos(); phase = 'play'; }
function screenDir(d, sg) {
  const n = normal(d), a = proj(d.x, 0.5, d.z), b = proj(d.x + n[0] * sg, 0.5, d.z + n[1] * sg);
  const l = Math.hypot(b[0] - a[0], b[1] - a[1]);
  return [(b[0] - a[0]) / l, (b[1] - a[1]) / l];
}

// ---- Live input: tap a spot and the tray, or flick a start pad.
function nearest(list, x, y, r) {
  let best = null, bd = r;
  for (const d of list) {
    if (d.state !== 'up') continue;
    const [sx, sy] = proj(d.x, (d.y || 0) + 0.4, d.z), e = Math.hypot(sx - x, sy - y);

function inRetry(x, y) { const [rx, ry, rw] = retryRect(); return x > rx - 20 && x < rx + rw + 20 && y > ry - 20 && y < ry + rw + 20; }
let down = null;
canvas.addEventListener('pointerdown', ev => {
  if (CC.auto) return;

  if (menu) {
    for (let i = 0; i < BUILD.length; i++) if (inRect(x, y, tileRect(i)) && i <= prog.unlocked) { menu = false; loadLevel(i); return; }
    if (inRect(x, y, backRect)) location.href = '/prototypes/';

  }
  if (inRect(x, y, levelsRect)) { menu = true; sel = null; return; }
  if (phase === 'clear' && CC.time >= phaseT) { if (li === BUILD.length - 1) menu = true; else loadLevel(li + 1); return; }
  if (inRetry(x, y)) { retry(); return; }
  if (sel && CC.time - selT > 0.2) {
    const b = panelButtons().find(b => Math.hypot(b.x - x, PANEL_Y - y) < b.r + 12);
    if (b) { press(b); return; }
  }
  if (lvl.layers) {
    const c = cardRects().find(c => inRect(x, y, c.r));
    const sp = !c && lvl.spots.find(o => o.layer != null && Math.hypot(...proj(o.x, o.y + 0.3, o.z).map((v, i) => v - [x, y][i])) < 70);
    if (c || sp) { toggleStencil(c ? c.k : sp.layer); return; }
  }
  const st = canAct() ? nearest(lvl.starts, x, y, 100) : null;
  if (st) { down = { d: st, x, y, t: performance.now() }; return; }
  const d = nearest(lvl.hot, x, y, 90);

});
canvas.addEventListener('pointerup', ev => {
  if (CC.auto || !down) return;
  const [x, y] = CC.toCanvas(canvas, ev), d = down.d, sd = screenDir(d, 1);
  const along = (x - down.x) * sd[0] + (y - down.y) * sd[1], quick = performance.now() - down.t < 450;
  if (Math.abs(along) > 60 && quick) { trail = { from: [down.x, down.y], to: [x, y], t: CC.time }; push(d, Math.sign(along)); }
  else { d.wob = CC.time; note(d, 'Une pichenette, plus vite !', '#ffb066'); }
  down = null;
});

// ---- Scripted runs for the videos
const H = k => () => lvl.h[k];
const at3 = get => () => proj(get().x, 0.4, get().z);
const spot = (at, get) => ({ at, target: at3(get), act: () => select(get()) });
const findBtn = what => panelButtons().find(b => what === 'turn' || what === 'remove' ? b.id === what : b.id === 'item' && b.color === what);
const btn = (at, what) => ({ at, target: () => { const b = findBtn(what); return b ? [b.x, PANEL_Y] : [CC.W / 2, PANEL_Y]; }, act: () => press(findBtn(what)) });
const retryAt = at => ({ at, target: () => { const [rx, ry, rw] = retryRect(); return [rx + rw / 2, ry + rw / 2]; }, act: retry });
function flickAt(at, get, sg = 1) {
  const from = at3(get), to = () => { const a = from(), v = screenDir(get(), sg); return [a[0] + v[0] * 220, a[1] + v[1] * 220]; };
  return [
    { at: at - 0.3, target: from, act: () => { trail = { from: from(), t: CC.time + 0.25 }; } },
    { at, target: to, press: false, act: () => push(get(), sg) },
    { at: at + 0.5, hide: true },
  ];
}
// Each item: a spot, then what is pressed on it (a tray color, 'turn' or 'remove').
function seq(t, items) {
  const out = [];
  for (const [get, ...whats] of items) {
    out.push(spot(t, get)); t += 1.25;
    for (const w of whats) { out.push(btn(t, w)); t += 1.0; }
    t += 0.25;
  }
  return out;
}
const Wh = '#f4f1e8', Bl = '#4a9cff', Gd = '#f0b429', Rd = '#e8434d', Ye = '#ffd23f';
function levelScript(t0) {
  const steps = [];
  let t = t0 + 2.0;
  for (const [get, ...acts] of lvl.sol || []) {
    steps.push(spot(t, get)); t += 1.25;
    for (const a of acts) { steps.push(btn(t, a)); t += 1.0; }
    t += 0.25;
  }
  steps.push(...flickAt(t + 0.4, () => lvl.h.start));
  return CC.script(steps);
}
let tour = null, fastT = -9;
const autoplay = t => {
  if (!tour) tour = levelScript(t);
  tour(t);
  // The video tour plays falls at double speed; settings and slow motion stay as they are.
  const running = doms.some(d => d.state === 'falling') || marbles.some(m => m.state === 'rolling');
  if (CC.recording && SPEED === 1 && running && !focus && slowFactor() === 1) { step(CC.DT); CC.time += CC.DT; fastT = CC.time; }
  if (phase === 'clear' && t > phaseT + 1.7 && li < LAST) { loadLevel(li + 1); tour = levelScript(CC.time); }
};

// ---- Checks
// Pairs of dominoes of two colors closer than `min`, away from the pieces that join colors.
function separation(L, min = 1.4) {
  const D = L.dominos, pieces = D.filter(o => o.sw || o.gate), col = o => o.sw ? o.good : o.color;
  const near = (o, g) => Math.hypot(o.x - g.x, o.z - g.z) <= (g.gate ? 1.3 : 1.45);

    const p = D[i], q = D[j], e = Math.hypot(p.x - q.x, p.z - q.z);
    if (col(p) === col(q)) { if (e < 0.75 && j - i > 2) same.push([i, j, +e.toFixed(2)]); continue; }
    if (p.sw || p.gate || q.sw || q.gate || p.comb || q.comb || (p.band && q.band) || pieces.some(g => near(p, g) && near(q, g))) continue;
    worst = Math.min(worst, e);

}
window.__check = () => BUILD.map(b => {
  const L = b();
  return [L.name, L.dominos.length, Math.round(worstTurn(L)), separation(L), L.cross && L.cross.map(c => [Math.round(c.cross), +c.s.toFixed(2), +c.sB.toFixed(2)])];
});
// Set every switch and pivot right, push the start, run to the end.
window.__solveLayers = (order) => BUILD.map((b, i) => {
  loadLevel(i); phase = 'play';
  const ks = order ? order(lvl.layers.length) : lvl.layers.map((l, k) => k);
  const run = n => { for (let k = 0; k < n; k++) { step(CC.DT); CC.time += CC.DT; } };
  ks.forEach((k, j) => putPot(lvl.spots[j], k)); sel = null;
  push(lvl.starts[0], 1); run(900);

});

  const keep = [li, CC.time];

  for (const m of marbles) if (m.flipper) m.flipper.pos = m.flipper.good;
  phase = 'play';
  push(lvl.h.start, lvl.h.sign || 1);
  for (let k = 0; k < 1500; k++) { step(CC.DT); CC.time += CC.DT; }
  const res = [lvl.name, doms.filter(d => d.state !== 'up').length, doms.length,
    doms.filter((o, j) => j > 0 && o.state === 'up' && doms[j - 1].state !== 'up').map(o => { const p = doms[o.i - 1]; return [o.i, o.color, o.pivot ? 'PIVOT' : '', o.gate ? 'GATE' : '', +Math.hypot(o.x - p.x, o.z - p.z).toFixed(2), Math.round(((o.a - p.a) / DEG + 540) % 360 - 180), p.targets && p.targets.map(t => [t.i, t.color, t.state])]; }),
    chains.map(c => c.block && [c.block.d.i, c.block.o.i]), goldBad ? 'GOLD ' + goldBad.gold : 'ok'];

// Top view of a level: dominoes, pieces and pairs of colors that come too close.
window.__plan = (i, scale = 60) => {
  const L = BUILD[i](), D = L.dominos;

  for (const d of D) { x0 = Math.min(x0, d.x); x1 = Math.max(x1, d.x); z0 = Math.min(z0, d.z); z1 = Math.max(z1, d.z); }

  for (let g = Math.ceil(z0); g < z1 + 2; g++) { x.beginPath(); x.moveTo(0, Z(g)); x.lineTo(cv.width, Z(g)); x.stroke(); }
  for (const d of D) {
    x.save(); x.translate(X(d.x), Z(d.z)); x.rotate(d.a);
    x.fillStyle = d.sw ? d.good : d.color; x.fillRect(-THIN / 2 * scale, -WIDE / 2 * scale, THIN * scale, WIDE * scale);
    if (d.sw) { x.strokeStyle = '#fff'; x.lineWidth = 3; x.beginPath(); x.arc(0, 0, 0.42 * scale, 0, 7); x.stroke(); }
    if (d.gate) { x.strokeStyle = '#000'; x.lineWidth = 2; x.strokeRect(-0.3 * scale, -0.3 * scale, 0.6 * scale, 0.6 * scale); }
    if (d.pivot) { x.strokeStyle = '#9aa3c7'; x.lineWidth = 3; x.beginPath(); x.arc(0, 0, 0.5 * scale, 0, 7); x.stroke(); }
    x.restore();
    x.fillStyle = '#fff'; x.font = '10px Arial'; x.fillText(d.i ?? D.indexOf(d), X(d.x) + 6, Z(d.z) - 6);

  for (const [a, b] of sep.same) { x.beginPath(); x.moveTo(X(D[a].x), Z(D[a].z)); x.lineTo(X(D[b].x), Z(D[b].z)); x.stroke(); }

};
// Run the script to time T without drawing, then draw one frame.
window.__shot = T => {
  while (CC.time < T - 1e-6) { autoplay(CC.time); step(CC.DT); CC.time += CC.DT; }

window.__debug = () => ({ level: li, phase, pushes, down: doms.filter(d => d.state !== 'up').length, total: doms.length,
  chains: chains.map(c => [c.n, c.block && [c.block.d.i, c.block.o.i, +c.block.t.toFixed(2)]]) });
